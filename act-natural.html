<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14121a">
<title>Act Natural</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#0e0d12;overflow:hidden;color:#fff4e2;font-family:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif}
#c{display:block;width:100vw;height:100vh;cursor:none}
body.phone{overflow:auto;height:auto;min-height:100%;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;background:radial-gradient(120% 80% at 50% 0%,#2a2233,#0e0d12 70%)}
#ph{max-width:560px;margin:0 auto;padding:10px 10px calc(16px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;margin:2px 2px 10px}
.logo{font-weight:800;font-size:22px;letter-spacing:.5px;flex:1}.logo i{color:#ffc94d}
.chip{font-weight:800;font-size:14px;padding:5px 12px;border-radius:99px;background:#2a2533}.chip.s0{background:#ffc94d;color:#14121a}.chip.s1{background:#62e0ff;color:#14121a}
.dot{width:10px;height:10px;border-radius:50%;background:#777}.dot.ok{background:#7be38a}.dot.bad{background:#ff6b6b}
.card{background:rgba(255,244,226,.06);border:1px solid rgba(255,244,226,.1);border-radius:16px;padding:10px 12px;margin-bottom:10px}
.center{text-align:center;padding:40px 18px}.center h1{font-size:30px;margin:0 0 10px;color:#ffc94d}.center h2{margin:0 0 10px}
.lbl{font:700 10px "Space Mono",monospace;letter-spacing:1px;color:rgba(255,244,226,.5);margin-bottom:6px;text-transform:uppercase}
.dim{color:rgba(255,244,226,.55)}
.row{display:grid;grid-template-columns:52% 1fr;gap:10px}
.mapbox{position:relative}.mapbox canvas{width:100%;border-radius:14px;display:block;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.mapbox .lbl{margin-top:6px;text-align:center}
.col .card{margin-bottom:8px}
.you{display:flex;gap:10px;align-items:center}.you canvas{width:72px;height:72px;flex:none}
#desc{font-size:13px;line-height:1.35}
.task{display:grid;grid-template-columns:26px 1fr 16px;gap:6px;align-items:center;font-size:13px;font-weight:700;margin:6px 0}
.task .em{font-size:20px}.task.done{color:#ffc94d}.task.done .bar i{background:#ffc94d}
.bar{height:5px;border-radius:9px;background:rgba(255,244,226,.12);margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:#62e0ff;transition:width .2s}
.mini{display:flex;justify-content:space-between;font:700 13px "Space Mono",monospace}
.gad{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gc{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:10px;border-radius:14px;background:rgba(255,244,226,.06);border:2px solid transparent;min-height:120px}
.gc .em{font-size:28px}.gc b{font-size:14px}.gc small{font-size:12px;color:rgba(255,244,226,.65);line-height:1.3;flex:1}.gc em{font:700 10px "Space Mono",monospace;color:rgba(255,244,226,.5);font-style:normal}
.gc.armed{border-color:#ff7a8a;background:rgba(255,122,138,.14)}.gc.armed em{color:#ff7a8a}
#intel p{margin:6px 0;font-size:14px;font-weight:700}
.ghost{all:unset;display:block;text-align:center;width:100%;padding:10px 0;font:700 12px "Space Mono",monospace;color:rgba(255,244,226,.55)}
#buzz{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;background:rgba(14,12,20,.55);box-shadow:inset 0 0 0 6px #ffc94d;animation:fl .3s ease-out}
#buzz.strong{box-shadow:inset 0 0 0 10px #ff6b6b;animation:sh .45s ease-in-out 3}
#buzzT{font-size:24px;font-weight:800;text-align:center;padding:20px;max-width:80%;background:#14121a;border-radius:18px}
#shield{position:fixed;inset:0;background:#0e0d12;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;font-weight:800;color:rgba(255,244,226,.5)}
#shield div{font-size:16px;line-height:2}
@keyframes fl{from{opacity:0}to{opacity:1}}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (max-width:380px){.row{grid-template-columns:48% 1fr}.you canvas{width:56px;height:56px}}
</style>
</head>

      b.x += b.vx * dt; b.y += b.vy * dt; b.h = Math.atan2(b.vy, b.vx);

function updShield() { const s = PH.$('shield'); s.hidden = !(PH.shield && !PH.peek && PH.phase === 'round'); }
let pconn = null, ppeer = null, pbc = null;
function psend(m) { m.seat = PH.seat; m.from = 'phone'; if (pbc) pbc.postMessage(m); else if (pconn && pconn.open) try { pconn.send(m); } catch (e) { } }
function phoneNet() {
  if (LOCAL_NET || typeof Peer === 'undefined') {
    pbc = new BroadcastChannel('actnatural-' + PH.code);
    pbc.onmessage = e => { const m = e.data; if (m && m.to === PH.seat) phoneMsg(m); };
    psend({ t: 'hello' });
    setInterval(() => psend(performance.now() - PH.last > 3000 ? { t: 'hello' } : { t: 'ping' }), 1500);
    return;
  }
  ppeer = new Peer({ host: '0.peerjs.com', port: 443, secure: true, path: '/', debug: 0 });
  const connect = () => {
    pconn = ppeer.connect('actnatural-' + PH.code, { reliable: true });
    pconn.on('open', () => psend({ t: 'hello' }));
    pconn.on('data', phoneMsg);
    pconn.on('close', () => setTimeout(connect, 1500));
    pconn.on('error', () => setTimeout(connect, 2000));
  };
  ppeer.on('open', connect);
  ppeer.on('error', err => { PH.$('waitH').textContent = err && err.type === 'peer-unavailable' ? 'Cab not found — rescan the code' : 'Connection trouble… retrying'; if (err && err.type === 'peer-unavailable') setTimeout(connect, 2500); });
  ppeer.on('disconnected', () => setTimeout(() => { try { ppeer.reconnect(); } catch (e) { } }, 1500));
  setInterval(() => psend({ t: 'ping' }), 2000);
}
function show(id) { for (const k of ['wait', 'game', 'endv']) PH.$(k).hidden = k !== id; updShield(); }
function phoneMsg(m) {
  PH.last = performance.now();
  const $ = PH.$;

    case 'welcome':
      $('who').textContent = m.names[m.seat]; $('who').className = 'chip s' + m.seat;
      if (PH.phase === 'connecting') { PH.phase = 'lobby'; $('waitH').textContent = `Connected as ${m.names[m.seat]}.`; $('waitP').innerHTML = 'Press <b>Ⓐ</b> on the cab when you are ready.<br><br>Prop the phone by your stick, screen toward you. Do not let your rival see it.'; show('wait'); }
      break;
    case 'round':
      PH.phase = 'round'; PH.round = m; PH.gadgets = m.gadgets; PH.armed = m.armed; PH.intel = []; PH.gossip = null; PH.st = null;
      $('who').textContent = m.names[m.seat]; $('who').className = 'chip s' + m.seat;
      drawMe(); $('desc').innerHTML = `<b>${m.words.shirt}</b> top<br><b>${m.words.head}</b><br><span class="dim">${m.lookalikes} lookalikes in the crowd</span>`;

      try { navigator.vibrate && navigator.vibrate(60); } catch (e) { }
      break;
    case 's': PH.st = m; if (m.g) { if (m.g.length !== PH.gadgets.length) { PH.gadgets = m.g; PH.armed = m.armed; renderGadgets(); } } renderTasks(); renderClock(); break;
    case 'gadgets': PH.gadgets = m.gadgets; PH.armed = m.armed; renderGadgets(); break;
    case 'intel': PH.intel.push(m.text); renderIntel(); buzz(m.text, false); break;
    case 'gossip': PH.gossip = { cx: m.cx, cy: m.cy, until: performance.now() + m.dur * 1000 }; break;
    case 'buzz': buzz(m.text, true); break;
    case 'end': PH.phase = 'end'; $('endH').textContent = m.result === 'won' ? 'YOU WIN THE ROUND' : m.result === 'lost' ? 'ROUND LOST' : 'DRAW'; $('endP').textContent = `${m.names[0]} ${m.score[0]} – ${m.score[1]} ${m.names[1]}  ·  look up at the cab for the replay`; show('endv'); break;
    case 'match': PH.phase = 'end'; $('endH').textContent = m.won ? 'YOU WON THE MATCH 🏆' : 'MATCH LOST'; $('endP').textContent = `${m.names[0]} ${m.score[0]} – ${m.score[1]} ${m.names[1]}`; show('endv'); break;
  }
}
function buzz(text, strong) {
  const b = PH.$('buzz'); PH.$('buzzT').textContent = text; b.hidden = false; b.className = strong ? 'strong' : '';
  try { navigator.vibrate && navigator.vibrate(strong ? [90, 60, 90, 60, 160] : [50]); } catch (e) { }
  clearTimeout(PH.bt); PH.bt = setTimeout(() => { b.hidden = true; }, strong ? 2600 : 2200);
}
function renderClock() {
  const s = PH.st; if (!s) return; const m = Math.floor(s.time / 60), x = s.time % 60;
  PH.$('clock').textContent = `${m}:${String(x).padStart(2, '0')}`; PH.$('tk').textContent = 'TACKLES ' + '■'.repeat(s.tk) + '□'.repeat(3 - s.tk);
}
function renderTasks() {
  const r = PH.round; if (!r) return; const s = PH.st;
  PH.$('tasks').innerHTML = r.tasks.map((id, i) => {
    const T = POI_TYPES[id], p = s ? s.prog[i] : 0, d = s ? s.done[i] : false;
    return `<div class="task ${d ? 'done' : ''}"><span class="em">${T.emoji}</span><div><div>${T.task}</div><div class="bar"><i style="width:${Math.round(p * 100)}%"></i></div></div><span>${d ? '✓' : ''}</span></div>`;
  }).join('');
}
function renderGadgets() {
  const el = PH.$('gad');
  if (!PH.gadgets.length) { el.innerHTML = '<p class="dim">All used up. You are on your own.</p>'; return; }
  el.innerHTML = PH.gadgets.map((k, i) => { const g = GADGETS[k]; return `<button class="gc ${i === PH.armed ? 'armed' : ''}" data-i="${i}"><span class="em">${g.emoji}</span><b>${g.name}</b><small>${g.desc}</small>${i === PH.armed ? '<em>ARMED · press Ⓑ</em>' : '<em>tap to arm</em>'}</button>`; }).join('');
  el.querySelectorAll('.gc').forEach(b => b.onclick = () => { PH.armed = +b.dataset.i; psend({ t: 'arm', i: PH.armed }); renderGadgets(); });
}
function renderIntel() { const el = PH.$('intel'); if (!PH.intel.length) return; el.innerHTML = PH.intel.slice(-4).reverse().map(t => `<p>${t}</p>`).join(''); }
function drawMe() {
  const c = PH.$('me').getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, 160, 160);
  c.fillStyle = '#d6c6a8'; c.beginPath(); c.arc(80, 80, 76, 0, TAU); c.fill();
  c.translate(80, 84); c.scale(4.2, 4.2);
  drawPerson(c, { x: 0, y: 0, h: -Math.PI / 2, look: -Math.PI / 2, vx: 0, vy: 0, walk: 0, outfit: PH.round.outfit, pose: 'stand', poseT: 0, dance: 0, wob: 0, umb: 0, id: 0, down: 0, startle: 0, grab: 0, lunge: 0, gawk: 0, phone: 0, item: 'none' }, 0);
}
function phoneFrame(t) {
  requestAnimationFrame(phoneFrame);
  if (PH.phase !== 'round') return;
  const cvs = PH.$('map'), box = cvs.parentElement, w = Math.floor(box.clientWidth), h = Math.floor(w * 1.5), dpr = Math.min(2, devicePixelRatio || 1);
  if (cvs.width !== w * dpr) { cvs.width = w * dpr; cvs.height = h * dpr; cvs.style.height = h + 'px'; }
  const c = cvs.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const k = w / WW;
  c.save(); if (PH.seat === 1) { c.translate(w, h); c.rotate(Math.PI); } c.scale(k, k);
  c.fillStyle = '#d6c6a8'; c.fillRect(0, 0, WW, WH);
  c.fillStyle = '#2b2730'; c.fillRect(0, 0, 40, WH); c.fillRect(960, 0, 40, WH);
  c.fillStyle = '#3e9db3'; rr(c, FOUNTAIN.x0, FOUNTAIN.y0, 240, 160, 18); c.fill();
  c.fillStyle = 'rgba(60,50,40,0.35)'; for (const s of SOLIDS) { if (s.tag === 'wall' || s.tag === 'pool') continue; if (s.k === 'c') { c.beginPath(); c.arc(s.x, s.y, s.r, 0, TAU); c.fill(); } else c.fillRect(s.x0, s.y0, s.x1 - s.x0, s.y1 - s.y0); }
  for (const tr of TREES) { c.fillStyle = 'rgba(70,110,60,0.35)'; c.beginPath(); c.arc(tr.x, tr.y, tr.r, 0, TAU); c.fill(); }
  // gossip zone
  if (PH.gossip && performance.now() < PH.gossip.until) { const a = 0.35 + 0.2 * Math.sin(t / 120); c.fillStyle = `rgba(255,90,110,${a})`; c.fillRect(PH.gossip.cx * WW / 3, PH.gossip.cy * WH / 3, WW / 3, WH / 3); }
  // POIs, with your errands ringed
  const mine = PH.round.tasks, s = PH.st;
  const seen = new Set();
  for (const p of POIS) {
    const i = mine.indexOf(p.type), done = i >= 0 && s && s.done[i];
    if (i >= 0 && !done) { c.strokeStyle = '#ffc94d'; c.lineWidth = 9; c.beginPath(); c.arc(p.x, p.y, 64, 0, TAU); c.stroke(); }
    if (p.type === 'bench' && seen.has('bench') && i < 0) { c.fillStyle = '#8a6a44'; c.fillRect(p.x - 20, p.y - 6, 40, 12); continue; }
    seen.add(p.type);
    c.save(); c.translate(p.x, p.y); if (PH.seat === 1) c.rotate(Math.PI); c.font = '84px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.globalAlpha = done ? 0.35 : 1; c.fillText(POI_TYPES[p.type].emoji, 0, 0); c.restore();
  }
  // you
  if (s) { const pulse = (t / 900) % 1; c.strokeStyle = '#ffc94d'; c.lineWidth = 10; c.globalAlpha = 1 - pulse; c.beginPath(); c.arc(s.x, s.y, 44 + pulse * 110, 0, TAU); c.stroke(); c.globalAlpha = 1; c.fillStyle = '#14121a'; c.beginPath(); c.arc(s.x, s.y, 44, 0, TAU); c.fill(); c.fillStyle = '#ffc94d'; c.beginPath(); c.arc(s.x, s.y, 36, 0, TAU); c.fill(); c.fillStyle = '#14121a'; c.beginPath(); c.arc(s.x, s.y, 13, 0, TAU); c.fill(); }
  if (s && s.rain) { c.fillStyle = 'rgba(80,100,160,0.15)'; c.fillRect(0, 0, WW, WH); }
  c.restore();
}

/* ---------------- main loop ---------------- */
let lastTS = 0, slowT = 0;
G.rtime = 0;
function boot() {
  if (IS_PHONE) { phoneMain(); return; }
  cv = document.getElementById('c'); ctx = cv.getContext('2d', { alpha: false });
  QUALITY = S.quality === 'low' ? 'low' : 'high';
  resize(); addEventListener('resize', () => resize());
  startAttract();
  requestAnimationFrame(frame);
}
function frame(ts) {
  requestAnimationFrame(frame);
  const now = ts / 1000; const rdt = Math.min(0.05, Math.max(0.001, now - lastTS || 0.016)); lastTS = now;
  pollInput();
  if (S.quality === 'auto' && QUALITY === 'high' && G.rtime > 4) { if (rdt > 0.026) slowT += rdt; else slowT = Math.max(0, slowT - rdt * 0.5); if (slowT > 3) { QUALITY = 'low'; resize(); } }
  G.rtime += rdt;
  if (G.paused) { pauseInput(); render(0); return; }
  pauseCheck(rdt);
  switch (G.phase) { case 'title': titleInput(); break; case 'lobby': lobbyInput(); break; case 'howto': howInput(); break; case 'settings': settingsInput(); break; }
  const dt = rdt * G.ts;
  simulate(dt, rdt);
  render(rdt);
}
function simulate(dt, rdt) {
  G.time += dt;
  updateEvents(dt);
  for (const p of G.npcs) npcUpdate(p, dt);
  for (const p of G.players) if (p) playerUpdate(p, dt);
  separate(G.people, dt);
  for (const p of G.people) integrate(p, dt);
  updatePigeons(dt, G.people);
  updateFX(dt);
  updateRound(dt, rdt);
  netTick(rdt);
  const k = 1 - Math.exp(-rdt * (G.phase === 'cine' ? 6 : 3));
  G.cam.x = lerp(G.cam.x, G.camT.x, k); G.cam.y = lerp(G.cam.y, G.camT.y, k); G.cam.z = lerp(G.cam.z, G.camT.z, k);
  G.shake = Math.max(0, G.shake - rdt * 22);
  if (Math.random() < dt * 0.15) Audio_.coo();
  if (Audio_.ok) Audio_.buskVol = 1;
}
function render(rdt) {
  setBase(); ctx.fillStyle = '#0e0d12'; ctx.fillRect(0, 0, LW, LH);
  drawWorld(G.time);
  if (G.phase === 'reveal') drawRevealWorld();
  if (QUALITY !== 'low') { setBase(); ctx.drawImage(VIG, 0, 0, LW, LH); }
  if (G.phase === 'cine') drawCine();
  if (['intro', 'play', 'cine', 'reveal'].includes(G.phase)) { drawHUD(0); drawHUD(1); }
  switch (G.phase) {
    case 'title': drawTitle(); break; case 'lobby': drawLobby(); break; case 'howto': drawHow(); break;
    case 'settings': drawSettings(); break; case 'reveal': drawRevealPanels(); break; case 'matchend': drawMatchEnd(); break;
  }
  if (G.phase !== 'settings' && G.phase !== 'matchend') drawBanners(rdt);
  if (G.phase === 'intro') drawIntro();
  if (G.paused) drawPause();
}
function drawCine() {
  const t = G.cine.t, bar = Math.min(1, t / 0.3) * LH * 0.08;
  setBase(); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, LW, bar); ctx.fillRect(0, LH - bar, LW, bar);
  if (t > 0.35) for (let seat = 0; seat < 2; seat++) {
    setSeat(seat); const k = clamp(LW / 1080, 0.5, 1.2), a = Math.min(1, (t - 0.35) / 0.2), sc = 1 + (1 - a) * 0.6;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(LW / 2, LH * 0.72); ctx.scale(sc, sc);
    const word = G.cine.kind === 'tackle' ? pick(['GOTCHA.']) : 'CONTRACT COMPLETE.';
    txt(word, 4, 4, 70 * k, 'rgba(0,0,0,0.5)', 800); txt(word, 0, 0, 70 * k, SEATCOL[G.cine.seat], 800);
    ctx.restore();
  }
}
function drawIntro() {
  const t = G.introT;
  for (let seat = 0; seat < 2; seat++) {
    setSeat(seat); const k = clamp(LW / 1080, 0.5, 1.2);
    ctx.globalAlpha = Math.min(1, t / 0.3, (4.5 - t) / 0.5);
    txt('ROUND ' + G.round, LW / 2, LH * 0.66, 64 * k, '#ffc94d', 800);
    const n = Math.ceil(4.5 - t); txt(n > 0 ? String(n) : 'GO', LW / 2, LH * 0.66 + 70 * k, 40 * k, PAL.cream, 700, 'center', MONO);
    ctx.globalAlpha = 1;
  }
}
(document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]) : Promise.resolve())
  .then(() => Promise.race([Promise.all([document.fonts.load(`800 30px ${FONT}`), document.fonts.load(`700 20px ${MONO}`)]).catch(() => { }), new Promise(r => setTimeout(r, 1200))]))
  .then(boot);
