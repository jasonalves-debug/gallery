<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>GLINT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Chakra+Petch:ital,wght@0,500;0,700;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#050407; --paper:#f4ede2; --red:#ff2a1a; --red2:#b3120a; --amber:#ffb36b; --mute:#8d8278;
  --disp:'Anton','Impact','Arial Narrow',sans-serif; --ui:'Chakra Petch',ui-monospace,Menlo,monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#050407;--paper:#f4ede2}}
:root[data-theme="dark"]{--ink:#050407;--paper:#f4ede2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);overflow:hidden;touch-action:none;font-family:var(--ui)}
#c,#hudc{position:fixed;inset:0;width:100%;height:100%;display:block}
#hudc{pointer-events:none}
.hidden{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}

/* ---------- title */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;padding:calc(24px + var(--sat)) calc(22px + var(--sar)) calc(24px + var(--sab)) calc(22px + var(--sal))}
#title{align-items:flex-start;background:linear-gradient(100deg,rgba(5,4,7,.9) 30%,rgba(5,4,7,.2) 75%,transparent)}
#title h1{font-family:var(--disp);font-size:clamp(84px,22vw,200px);line-height:.8;margin:0;letter-spacing:.01em;font-style:italic;transform:skewX(-8deg);
  color:var(--paper);text-shadow:4px 4px 0 var(--red2),8px 8px 0 #000;position:relative}
#title h1::after{content:'';position:absolute;right:-.12em;top:.12em;width:.16em;height:.16em;background:var(--red);border-radius:50%;box-shadow:0 0 24px 6px rgba(255,42,26,.7);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.7)}}
#title .tag{font-size:13px;letter-spacing:.3em;color:var(--mute);margin:18px 0 30px;text-transform:uppercase;line-height:1.8}
#title .tag b{color:var(--red);font-weight:700}
.cta{font-family:var(--disp);font-size:26px;letter-spacing:.18em;padding:12px 34px;background:var(--red);color:#000;clip-path:polygon(6% 0,100% 0,94% 100%,0 100%);transition:transform .08s}
.cta:active{transform:scale(.95)}
.cta:disabled{opacity:.75}
#progwrap{width:230px;height:3px;background:#1d1714;margin-top:16px;transform:skewX(-20deg)}
#prog{height:3px;background:var(--red);width:0}

/* ---------- select */
#select{background:linear-gradient(100deg,rgba(5,4,7,.92) 35%,rgba(5,4,7,.35));gap:10px}
#select h2{font-family:var(--disp);font-size:15px;letter-spacing:.4em;color:var(--mute);margin:0 0 6px;font-weight:400}
#missions{display:flex;flex-direction:column;gap:10px;max-width:520px;width:100%}
.mis{display:flex;align-items:center;gap:16px;padding:12px 18px;background:rgba(244,237,226,.05);border-left:4px solid var(--red);text-align:left;transition:transform .1s,background .1s}
.mis:active{transform:translateX(6px);background:rgba(255,42,26,.18)}
.mis .n{font-family:var(--disp);font-size:34px;color:var(--red);font-style:italic;width:44px}
.mis .ttl{flex:1;font-family:var(--disp);font-size:26px;letter-spacing:.06em;line-height:1}
.mis .ttl small{display:block;font-family:var(--ui);font-size:11px;letter-spacing:.24em;color:var(--mute);margin-top:6px}
.mis .g{font-family:var(--disp);font-size:30px;color:#3a332e;font-style:italic}
.mis .g[data-g="S"]{color:var(--red)} .mis .g[data-g="A"]{color:var(--amber)} .mis .g[data-g="B"],.mis .g[data-g="C"],.mis .g[data-g="D"]{color:var(--paper)}
#select .hint{font-size:11px;letter-spacing:.2em;color:#5c534c;text-transform:uppercase;margin-top:10px;line-height:2}
#select .hint b{color:var(--paper);font-weight:500}

/* ---------- HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#hud .hud-btn,#hud .slider{pointer-events:auto}
.top{position:absolute;top:calc(10px + var(--sat));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px}
#timer{font-family:var(--disp);font-size:34px;letter-spacing:.04em;font-style:italic;text-shadow:3px 3px 0 #000;line-height:1}
#timer.hot{color:var(--red);animation:throb .5s steps(2) infinite}
@keyframes throb{50%{transform:scale(1.12)}}
#left{display:flex;gap:5px}
#left i{width:14px;height:6px;background:var(--red);transform:skewX(-25deg);box-shadow:0 0 6px rgba(255,42,26,.6)}
#left i.boss{width:26px;background:var(--paper)}
#forced{font-family:var(--disp);font-size:20px;letter-spacing:.2em;color:#000;background:var(--red);padding:3px 14px;transform:skewX(-12deg);opacity:0;transition:opacity .1s}
#forced.on{opacity:1;animation:throb .5s steps(2) infinite}
#scorebox{position:absolute;top:calc(12px + var(--sat));left:calc(16px + var(--sal));line-height:1}
#score{font-family:var(--disp);font-size:28px;font-style:italic;text-shadow:3px 3px 0 #000}
#combo{font-family:var(--disp);font-size:40px;color:var(--red);font-style:italic;text-shadow:3px 3px 0 #000;display:block;transform:scale(0);transition:transform .12s cubic-bezier(.3,2,.5,1)}
#combo.on{transform:scale(1) rotate(-6deg)}
#menu{position:absolute;top:calc(10px + var(--sat));right:calc(14px + var(--sar));width:38px;height:38px;display:grid;place-items:center;color:var(--mute);font-size:18px}
#gyro{position:absolute;top:calc(10px + var(--sat));right:calc(56px + var(--sar));height:38px;padding:0 10px;font-size:11px;letter-spacing:.2em;color:var(--paper)}
#gyro.off{color:#55504a;text-decoration:line-through}
#breach{position:absolute;right:calc(18px + var(--sar));top:calc(60px + var(--sat));font-family:var(--disp);font-size:20px;letter-spacing:.2em;padding:9px 18px 9px 22px;color:var(--red);border:2px solid var(--red);transform:skewX(-12deg);background:rgba(0,0,0,.45)}
#breach.on{background:var(--red);color:#000}
#fire{position:absolute;right:calc(22px + var(--sar));bottom:calc(22px + var(--sab));width:92px;height:92px;border-radius:50%;background:radial-gradient(circle,rgba(255,42,26,.9) 0 46%,rgba(255,42,26,.25) 47% 60%,transparent 61%);border:2px solid var(--red);box-shadow:0 0 22px rgba(255,42,26,.35)}
#fire::after{content:'';position:absolute;inset:38%;border:2px solid #000;border-radius:50%}
#fire.on{transform:scale(.92)}
#fire.cycling{filter:grayscale(1) brightness(.5)}
#focus{position:absolute;right:calc(128px + var(--sar));bottom:calc(30px + var(--sab));width:82px;padding:10px 0 8px;font-family:var(--disp);font-size:15px;letter-spacing:.2em;border:1px solid rgba(244,237,226,.5);background:rgba(0,0,0,.4);transform:skewX(-10deg)}
#focus.on{background:var(--paper);color:#000}
#focusbar{height:3px;margin:6px 10px 0;background:rgba(255,255,255,.15)}
#focusfill{height:100%;background:var(--amber);transform-origin:left}
#zoom{position:absolute;left:calc(14px + var(--sal));bottom:calc(30px + var(--sab));width:44px;height:min(42vh,220px);border-left:2px solid rgba(244,237,226,.35)}
#zoomfill{position:absolute;left:-2px;bottom:0;width:2px;background:var(--red)}
#mag{position:absolute;left:12px;top:-4px;font-family:var(--disp);font-size:17px;font-style:italic}
#plates{position:absolute;left:calc(18px + var(--sal));bottom:calc(22px + var(--sab));display:flex;gap:6px}
#plates i{width:30px;height:38px;background:var(--paper);clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%);transition:opacity .2s}
#plates i.gone{opacity:.12;background:var(--red)}
#ammo{position:absolute;right:calc(22px + var(--sar));bottom:calc(18px + var(--sab));font-family:var(--disp);font-size:46px;font-style:italic;text-shadow:3px 3px 0 #000}
body[data-mode="snipe"] .bm{display:none!important} body[data-mode="breach"] .sm{display:none!important}
body.cine #hud{opacity:0}
#minfo{position:absolute;left:0;right:0;top:34%;text-align:center;opacity:0;pointer-events:none}
#minfo.fade{animation:minfo 2.6s ease forwards}
@keyframes minfo{0%{opacity:0;letter-spacing:.6em}15%{opacity:1;letter-spacing:.12em}75%{opacity:1}100%{opacity:0}}
#mt{font-family:var(--disp);font-size:clamp(40px,9vw,84px);font-style:italic;text-shadow:4px 4px 0 var(--red2),7px 7px 0 #000}
#ma{font-size:12px;letter-spacing:.35em;color:var(--amber);margin-top:6px}

/* ---------- kill popups */
#pops{position:fixed;left:50%;top:74%;pointer-events:none}
.pop{position:absolute;left:0;top:0;transform:translate(-50%,0) rotate(var(--r));animation:pop 1.25s cubic-bezier(.2,1.6,.4,1) forwards;text-align:center;white-space:nowrap}
.pop b{display:block;font-family:var(--disp);font-size:38px;font-style:italic;color:var(--paper);text-shadow:3px 3px 0 #000,-1px -1px 0 #000;letter-spacing:.03em}
.pop i{display:inline-block;font-style:normal;font-family:var(--disp);font-size:20px;background:var(--paper);color:#000;padding:1px 10px;transform:skewX(-14deg);margin-top:2px}
.pop.hot b{color:var(--red);font-size:48px}
.pop.bad b{color:var(--red)} .pop.bad i{background:var(--red)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) rotate(var(--r)) scale(2.2)}12%{opacity:1;transform:translate(-50%,0) rotate(var(--r)) scale(1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-50px) rotate(var(--r)) scale(.95)}}

/* ---------- anime cut-in */
#cutin{position:fixed;inset:0;pointer-events:none;display:none;overflow:hidden}
#cutin.on{display:block}
#cutin::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.55);animation:dim .25s ease}
#cutband{position:absolute;left:-10%;right:-10%;top:50%;height:min(38vh,230px);transform:translateY(-50%) rotate(-7deg);background:var(--red);
  background-image:radial-gradient(rgba(0,0,0,.28) 1.2px,transparent 1.6px);background-size:7px 7px;border-top:6px solid #000;border-bottom:6px solid #000;
  animation:band .32s cubic-bezier(.2,1,.3,1);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
#cutband::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 40px,rgba(255,255,255,.18) 40px 42px,transparent 42px 120px);animation:streak .35s linear infinite}
#cut-big{font-family:var(--disp);font-size:clamp(70px,19vw,190px);line-height:.9;font-style:italic;color:#fff;text-shadow:5px 5px 0 #000;letter-spacing:.02em;animation:slam .4s cubic-bezier(.2,1.8,.4,1);position:relative;z-index:1}
#cut-small{font-family:var(--disp);font-size:clamp(14px,3vw,24px);letter-spacing:.4em;color:#000;position:relative;z-index:1;margin-top:4px}
#cutin.quick #cutband{height:min(16vh,90px);top:22%}
#cutin.quick #cut-small{color:#fff;font-size:clamp(22px,5vw,40px);letter-spacing:.25em;text-shadow:3px 3px 0 #000}
#cutin.quick::before{background:transparent}
#cutin.fin #cutband{background-color:#000;border-color:var(--red)}
#cutin.fin #cut-big{color:var(--red);text-shadow:5px 5px 0 #fff}
#cutin.fin #cut-small{color:#fff}
@keyframes band{from{transform:translate(110%,-50%) rotate(-7deg)}to{transform:translate(0,-50%) rotate(-7deg)}}
@keyframes slam{from{transform:scale(3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes streak{to{background-position:120px 0}}
@keyframes dim{from{opacity:0}}

/* ---------- result */
#result{align-items:center;text-align:center;background:radial-gradient(circle at 50% 45%,rgba(5,4,7,.55),rgba(5,4,7,.95) 70%)}
#r-grade{font-family:var(--disp);font-size:clamp(130px,34vw,260px);line-height:.85;font-style:italic;color:var(--paper);text-shadow:6px 6px 0 var(--red2),12px 12px 0 #000;animation:slam .5s cubic-bezier(.2,1.8,.4,1)}
#r-grade[data-g="S"]{color:var(--red);text-shadow:6px 6px 0 #fff,12px 12px 0 #000}
#r-grade[data-g="F"]{color:#4a4440}
#r-title{font-family:var(--disp);font-size:24px;letter-spacing:.35em;margin-top:8px}
#r-score{font-family:var(--disp);font-size:52px;font-style:italic;color:var(--amber);margin:4px 0 10px}
#r-rows{display:grid;grid-template-columns:1fr 1fr;gap:4px 26px;font-size:12px;letter-spacing:.2em;color:var(--mute);max-width:420px;width:100%}
#r-rows div{display:flex;justify-content:space-between;border-bottom:1px solid #221d1a;padding:4px 0}
#r-rows b{color:var(--paper);font-weight:700}
.rbtns{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap;justify-content:center}
.rbtns button{font-family:var(--disp);font-size:20px;letter-spacing:.2em;padding:10px 22px;border:2px solid var(--paper);transform:skewX(-10deg)}
.rbtns button.pri{background:var(--red);border-color:var(--red);color:#000}
@media (max-height:460px){#r-grade{font-size:84px}#r-title{margin-top:0}#r-rows{gap:0 22px}#r-score{font-size:36px;margin:0 0 6px}.rbtns{margin-top:12px}#title h1{font-size:110px}#title .tag{margin:12px 0 18px}}
</style>
</head>
<body data-mode="snipe">
<canvas id="c"></canvas>
<canvas id="hudc"></canvas>

<div id="hud" class="hidden">
  <div class="top"><div id="timer" class="sm">1:00</div><div id="left" class="sm"></div><div id="forced" class="sm">BREACH IN 5</div></div>
  <div id="scorebox"><div id="score">0</div><span id="combo"></span></div>
  <button id="gyro" class="hud-btn sm">GYRO</button>
  <button id="menu" class="hud-btn">✕</button>
  <button id="breach" class="hud-btn sm" data-btn>BREACH</button>
  <div id="zoom" class="slider sm"><div id="zoomfill"></div><div id="mag">6.0×</div></div>
  <button id="focus" class="hud-btn sm" data-btn>FOCUS<div id="focusbar"><div id="focusfill"></div></div></button>
  <button id="fire" class="hud-btn sm" data-btn aria-label="Fire"></button>
  <div id="plates" class="bm"><i></i><i></i><i></i></div>
  <div id="ammo" class="bm">20</div>
  <div id="minfo"><div id="mt"></div><div id="ma"></div></div>
</div>
<div id="pops"></div>
<div id="cutin"><div id="cutband"><div id="cut-big"></div><div id="cut-small"></div></div></div>

<section id="title" class="screen">
  <h1>GLINT</h1>
  <div class="tag">Watch for the <b>red glint</b>. Take the shot.<br>Or kick the door.</div>
  <button id="begin" class="cta">PLAY</button>
  <div id="progwrap"><div id="prog"></div></div>
</section>

<section id="select" class="screen hidden">
  <h2>MISSIONS · TORONTO</h2>
  <div id="missions"></div>
  <div class="hint"><b>Snipe</b> every gunman before the clock runs out · <b>Breach</b> any time · Miss, and the team goes in hot</div>
</section>

<section id="result" class="screen hidden">
  <div id="r-grade">S</div>
  <div id="r-title">ROOM CLEAR</div>
  <div id="r-score">0</div>
  <div id="r-rows"></div>
  <div class="rbtns"><button id="r-retry">RETRY</button><button id="r-next" class="pri">NEXT</button><button id="r-list">MISSIONS</button></div>
