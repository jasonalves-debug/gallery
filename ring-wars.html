function textW(s,sc){ return s.length*6*sc-sc; }
function text(str,x,y,col,sc,align){
  sc=sc||1; str=String(str).toUpperCase();
  if(align==='c') x-=Math.floor(textW(str,sc)/2); else if(align==='r') x-=textW(str,sc);
  ctx.fillStyle=col;
  let cx=x;
  for(let i=0;i<str.length;i++){
    const g=FONT[str[i]]||FONT[' '];
    for(let c=0;c<5;c++){
      const b=g[c]; if(!b) continue;
      for(let r=0;r<7;r++) if(b&(1<<r)) ctx.fillRect(cx+c*sc,y+r*sc,sc,sc);
    }
    cx+=6*sc;
  }
}
function textS(str,x,y,col,sc,align){
  sc=sc||1; const s2=String(str).toUpperCase();
  let bx=x;
  if(align==='c') bx-=Math.floor(textW(s2,sc)/2); else if(align==='r') bx-=textW(s2,sc);
  text(s2,bx+sc,y+sc,C.black,sc,'l'); text(s2,bx,y,col,sc,'l');
}

/* ============================================================
   PIXEL PRIMITIVES
   ============================================================ */
function px(x,y,w,h,col){ ctx.fillStyle=col; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function limb(ax,ay,bx,by,w,col){
  const len=Math.hypot(bx-ax,by-ay);
  const steps=Math.max(1,Math.ceil(len/1.5));
  let ww=Math.max(2,Math.round(w/2)*2);
  ctx.fillStyle=col;
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    ctx.fillRect(Math.round((ax+(bx-ax)*t)/2)*2-ww/2, Math.round((ay+(by-ay)*t)/2)*2-ww/2, ww, ww);
  }
}
function disc(cx,cy,r,col){
  ctx.fillStyle=col;
  for(let y=-r;y<=r;y+=2){
    const w=Math.floor(Math.sqrt(Math.max(0,r*r-y*y)));
    ctx.fillRect(Math.round((cx-w)/2)*2, Math.round((cy+y)/2)*2, Math.round(w)*2, 2);
  }
}
function ring(cx,cy,r,w,col,a0,a1){
  ctx.strokeStyle=col; ctx.lineWidth=w; ctx.beginPath();
  ctx.arc(cx,cy,r,a0===undefined?0:a0,a1===undefined?Math.PI*2:a1); ctx.stroke();
}

   ============================================================ */
let AC=null, sndOn=true, voxOn=true;
function actx(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(f,dur,type,vol,slide){
  if(!sndOn) return; const a=actx(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,a.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),a.currentTime+dur);
  g.gain.setValueAtTime(vol||0.12,a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur);
}
function noise(dur,vol,lp){
  if(!sndOn) return; const a=actx(); if(!a) return;
  const n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(); s.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp||1200;
  const g=a.createGain(); g.gain.value=vol||0.2;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}

function crowd(level,dur){
  if(!sndOn) return; const a=actx(); if(!a) return;
  const d=dur||1.4, n=Math.floor(a.sampleRate*d), buf=a.createBuffer(1,n,a.sampleRate), ch=buf.getChannelData(0);
  for(let i=0;i<n;i++){ const t=i/n; const env=Math.min(1,t*6)*(1-t*t); ch[i]=(Math.random()*2-1)*env; }
  const s=a.createBufferSource(); s.buffer=buf;
  const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900; f.Q.value=0.6;
  const g=a.createGain(); g.gain.value=(level||0.5)*0.30;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
function say(s){
  if(!voxOn) return;

    speechSynthesis.cancel(); speechSynthesis.speak(u);

}

const MUS={cur:null};
let NOISE=null, DIST=null;
function noiseBuf(){
  const a=actx(); if(!a) return null;
  if(!NOISE){ const n=a.sampleRate*1.5|0; NOISE=a.createBuffer(1,n,a.sampleRate); const d=NOISE.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; }
  return NOISE;
}
function distCurve(){
  if(DIST) return DIST;
  const n=1024; DIST=new Float32Array(n);
  for(let i=0;i<n;i++){ const x=i/n*2-1; DIST[i]=Math.tanh(x*5.5); }
  return DIST;
}
function env(g,t,vol,att,dur,rel){
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol),t+att);
  g.gain.setValueAtTime(Math.max(0.0002,vol),t+Math.max(att,dur));
  g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(att,dur)+rel);
}
function mNote(bus,inst,freq,t,dur,vol){
  const a=AC, g=a.createGain(); g.connect(bus);
  const end=t+dur+0.6;
  const osc=(type,f,det)=>{ const o=a.createOscillator(); o.type=type; o.frequency.setValueAtTime(f,t); if(det) o.detune.value=det; o.start(t); o.stop(end); return o; };
  if(inst==='square'){ osc('square',freq).connect(g); env(g,t,vol,0.005,dur*0.9,0.05); }
  else if(inst==='tri'){ osc('triangle',freq).connect(g); env(g,t,vol,0.005,dur*0.95,0.06); }
  else if(inst==='sub'){ osc('sine',freq).connect(g); env(g,t,vol,0.02,dur,0.3); }
  else if(inst==='saw'){
    const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900; f.connect(g);
    osc('sawtooth',freq).connect(f); env(g,t,vol,0.005,dur*0.9,0.06);
  }
  else if(inst==='brass'){
    const f=a.createBiquadFilter(); f.type='lowpass'; f.Q.value=2;
    f.frequency.setValueAtTime(500,t); f.frequency.exponentialRampToValueAtTime(2600,t+0.07); f.frequency.exponentialRampToValueAtTime(1300,t+dur);
    f.connect(g); osc('sawtooth',freq,-6).connect(f); osc('sawtooth',freq,6).connect(f);
    env(g,t,vol,0.035,dur*0.92,0.12);
  }
  else if(inst==='guitar'){
    const ws=a.createWaveShaper(); ws.curve=distCurve();
    const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=2600;
    ws.connect(f); f.connect(g);
    for(const m of [1,1.4983,2]){ osc('sawtooth',freq*m,-8).connect(ws); osc('sawtooth',freq*m,8).connect(ws); }
    env(g,t,vol,0.004,dur*0.92,0.08);
  }
  else if(inst==='pipe'){
    const o=osc('square',freq); const lfo=osc('sine',6.2); const lg=a.createGain(); lg.gain.value=14; lfo.connect(lg); lg.connect(o.detune);
    const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq*2; f.Q.value=0.8;
    o.connect(f); f.connect(g); env(g,t,vol,0.01,dur*0.95,0.04);
  }
  else if(inst==='organ'){
    const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=2200; f.connect(g);
    osc('triangle',freq,-4).connect(f); osc('triangle',freq,4).connect(f); osc('sine',freq*2).connect(f); osc('square',freq*0.5).connect(f);
    env(g,t,vol*0.8,0.04,dur*0.95,0.25);
  }
  else if(inst==='timp'){
    const o=a.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(freq*1.5,t); o.frequency.exponentialRampToValueAtTime(freq,t+0.05);
    o.connect(g); o.start(t); o.stop(t+1.2); env(g,t,vol,0.004,0.04,0.7);
    const s=a.createBufferSource(); s.buffer=noiseBuf(); const nf=a.createBiquadFilter(); nf.type='lowpass'; nf.frequency.value=300;
    const ng=a.createGain(); ng.connect(bus); s.connect(nf); nf.connect(ng); env(ng,t,vol*0.4,0.002,0.02,0.15); s.start(t); s.stop(t+0.3);
  }
  else if(inst==='bell'){
    for(const [m,v,dec] of [[1,1,3.2],[2.76,0.5,1.6],[5.4,0.25,0.8]]){
      const gg=a.createGain(); gg.connect(bus); osc('sine',freq*m).connect(gg);
      gg.gain.setValueAtTime(0.0001,t); gg.gain.exponentialRampToValueAtTime(vol*v,t+0.006);
      gg.gain.exponentialRampToValueAtTime(0.0001,t+dec);
    }
  }
}
function mDrum(bus,kind,t,acc){
  const a=AC, g=a.createGain(); g.connect(bus);
  if(kind==='kick'){
    const o=a.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(42,t+0.16);
    o.connect(g); env(g,t,0.55,0.002,0.02,0.24); o.start(t); o.stop(t+0.4);
  } else {
    const s=a.createBufferSource(); s.buffer=noiseBuf();
    const f=a.createBiquadFilter();
    if(kind==='snare'){ f.type='bandpass'; f.frequency.value=1900; f.Q.value=0.7; env(g,t,acc?0.36:0.26,0.002,0.02,0.16);
      const o=a.createOscillator(); o.type='triangle'; o.frequency.value=190; const og=a.createGain(); og.connect(bus);
      o.connect(og); env(og,t,0.16,0.002,0.01,0.08); o.start(t); o.stop(t+0.2); }
    else if(kind==='clap'){ f.type='bandpass'; f.frequency.value=1200; f.Q.value=1.2; env(g,t,0.3,0.004,0.03,0.14); }
    else if(kind==='hat'){ f.type='highpass'; f.frequency.value=7500; env(g,t,0.07,0.001,0.005,0.04); }
    else if(kind==='gong'){ f.type='lowpass'; f.frequency.value=380; env(g,t,0.5,0.01,0.2,3.2);
      const o=a.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(92,t); o.frequency.exponentialRampToValueAtTime(70,t+3);
      const og=a.createGain(); og.connect(bus); o.connect(og); env(og,t,0.22,0.01,0.3,3.0); o.start(t); o.stop(t+3.6); }
    s.connect(f); f.connect(g); s.start(t); s.stop(t+(kind==='gong'?3.6:0.5));
  }
}
function mDrone(bus,D,t,dur){
  const a=AC;
  for(const n of D.notes){

    for(const det of [-5,5]){ const o=a.createOscillator(); o.type=D.inst==='reed'?'sawtooth':'triangle';
      o.frequency.value=midiF(D.root+n); o.detune.value=det; o.connect(f); o.start(t); o.stop(t+dur+0.3); }
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(D.vol,t+0.3);
    g.gain.setValueAtTime(D.vol,t+dur-0.05); g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.25);

function trackStep(bus,tr,step,t,spb){
  const tok=tr.seq[step];
  if(tok==='_'||tok==='.') return;
  let n=1; while(n<tr.seq.length && tr.seq[(step+n)%tr.seq.length]==='_') n++;
  const dur=tr.short? spb*0.8 : n*spb;
  const m=/^(-?\d+)([mM]?)$/.exec(tok); if(!m) return;
  const root=tr.root+(+m[1]);
  const tri = m[2]==='m'?[0,3,7] : (m[2]==='M'||tr.triad)?[0,4,7] : null;
  if(tri){ for(const iv of tri) mNote(bus,tr.inst,midiF(root+iv),t,dur,tr.vol); }
  else mNote(bus,tr.inst,midiF(root),t,dur,tr.vol);
}
function playTheme(i){
  stopTheme(0.6);
  const a=actx(); if(!a||!sndOn) return;
  const T=THEMES[i]; if(!T) return;
  const bus=a.createGain(); bus.gain.value=0.0001; bus.connect(a.destination);
  bus.gain.exponentialRampToValueAtTime(0.85,a.currentTime+0.4);
  const st={T,bus,step:0,next:a.currentTime+0.08,timer:null};
  const spb=60/T.bpm/4;
  st.timer=setInterval(()=>{
    while(st.next<a.currentTime+0.14){
      const s=st.step%T.len, s16=s%16;
      let t=st.next; if(T.swing && (s%2===1)) t+=spb*T.swing;
      const hit=(pat,k)=>pat&&pat.length&&pat[s%pat.length];
      if(hit(T.kick)==='x') mDrum(bus,'kick',t);
      const sn=hit(T.snare); if(sn==='x'||sn==='X'){ mDrum(bus,'snare',t,sn==='X'); if(T.clap) mDrum(bus,'clap',t+0.01); }
      if(hit(T.hat)==='x') mDrum(bus,'hat',t);
      if(hit(T.gong)==='x') mDrum(bus,'gong',t);
      if(T.drone && s===0) mDrone(bus,T.drone,t,T.len*spb);
      for(const k of ['bass','chord','lead','lead2','timp']) if(T[k]) trackStep(bus,T[k],s,t,spb);
      st.next+=spb; st.step++;
    }
  },25);
  MUS.cur=st;
}
function stopTheme(fade){
  const st=MUS.cur; if(!st) return;
  MUS.cur=null;
  const a=AC; fade=fade||0.8;
  try{ st.bus.gain.cancelScheduledValues(a.currentTime);
       st.bus.gain.setValueAtTime(Math.max(0.0002,st.bus.gain.value),a.currentTime);
       st.bus.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+fade); }catch(e){}
  clearInterval(st.timer);
  setTimeout(()=>{ try{ st.bus.disconnect(); }catch(e){} }, fade*1000+2500);
}

/* ============================================================
   COMMENTARY — pre-rendered neural voices (ring announcer,
   play-by-play, colour man), broadcast EQ, arena reverb on the
   announcer, music ducking, priority queue. Falls back to the
   device's best speech voice if decoding fails.
   ============================================================ */
const COMM={buf:{},last:{},ready:false,loading:false,cur:null,queue:[],chain:null,rev:null,fb:null};
function b64ToBuf(b){ const s=atob(b), n=s.length, u=new Uint8Array(n); for(let i=0;i<n;i++) u[i]=s.charCodeAt(i); return u.buffer; }
function commInit(){
  const a=actx(); if(!a||COMM.loading) return; COMM.loading=true;
  if(typeof VO_DATA==='undefined') return;
  const jobs=[];
  for(const key in VO_DATA){
    COMM.buf[key]=[];
    VO_DATA[key].forEach((b,i)=>{
      jobs.push(new Promise(res=>{
        try{ a.decodeAudioData(b64ToBuf(b),buf=>{ COMM.buf[key][i]=buf; res(); },()=>res()); }catch(e){ res(); }
      }));
    });
  }
  Promise.all(jobs).then(()=>{ COMM.ready=true; });
}
function commChain(role){
  const a=AC;
  if(!COMM.chain){
    COMM.chain={};
    // arena impulse: 1.8s decaying noise, slightly darker over time
    const len=Math.floor(a.sampleRate*1.8), ir=a.createBuffer(2,len,a.sampleRate);
    for(let ch=0;ch<2;ch++){ const d=ir.getChannelData(ch); let lp=0;
      for(let i=0;i<len;i++){ const t=i/len; lp=lp*0.6+(Math.random()*2-1)*0.4; d[i]=lp*Math.pow(1-t,2.6)*(i<a.sampleRate*0.012?0:1); } }
    COMM.rev=a.createConvolver(); COMM.rev.buffer=ir;
    const revOut=a.createGain(); revOut.gain.value=0.9; COMM.rev.connect(revOut); revOut.connect(a.destination);
    const mk=(hp,peakF,peakG,lp,wet,vol)=>{
      const comp=a.createDynamicsCompressor();
      comp.threshold.value=-20; comp.ratio.value=4; comp.attack.value=0.003; comp.release.value=0.15; comp.knee.value=8;
      const h=a.createBiquadFilter(); h.type='highpass'; h.frequency.value=hp; h.Q.value=0.7;
      const p=a.createBiquadFilter(); p.type='peaking'; p.frequency.value=peakF; p.gain.value=peakG; p.Q.value=0.9;
      const l=a.createBiquadFilter(); l.type='lowpass'; l.frequency.value=lp;
      const g=a.createGain(); g.gain.value=vol;
      const w=a.createGain(); w.gain.value=wet;
      h.connect(p); p.connect(l); l.connect(comp); comp.connect(g); g.connect(a.destination); g.connect(w); w.connect(COMM.rev);
      return h;
    };
    COMM.chain.ra =mk(85, 2600,3,9500,0.42,1.15);   // ring announcer: big, roomy PA
    COMM.chain.pbp=mk(140,3000,4,7600,0.05,1.05);   // booth headset
    COMM.chain.cc =mk(150,2800,3.5,7000,0.05,1.0);
  }
  return COMM.chain[role];
}
const VO_ROLE=k=>k.startsWith('ra_')?'ra':k.startsWith('cc_')?'cc':'pbp';
function pickVar(key){
  const arr=COMM.buf[key]; if(!arr||!arr.length) return null;
  const idxs=arr.map((b,i)=>b?i:-1).filter(i=>i>=0); if(!idxs.length) return null;
  let i=idxs[(Math.random()*idxs.length)|0];
  if(idxs.length>1 && i===COMM.last[key]) i=idxs[(idxs.indexOf(i)+1)%idxs.length];
  COMM.last[key]=i; return arr[i];
}
function duckMusic(on){
  const st=MUS.cur; if(!st||!AC) return;
  try{ const g=st.bus.gain, t=AC.currentTime; g.cancelScheduledValues(t); g.setTargetAtTime(on?0.28:0.85,t,on?0.05:0.4); }catch(e){}
}
function commStop(){
  if(COMM.cur){ try{ COMM.cur.src.onended=null; COMM.cur.src.stop(); }catch(e){} COMM.cur=null; duckMusic(false); }
  COMM.queue.length=0;
}
function commStart(item){
  const a=AC, buf=pickVar(item.key);
  if(!buf){ commFallback(item.key); return; }
  const src=a.createBufferSource(); src.buffer=buf;
  const role=VO_ROLE(item.key);
  src.playbackRate.value = role==='ra'?0.95:1.0;      // a touch deeper for the PA voice
  src.connect(commChain(role));
  const cur={src,prio:item.prio,key:item.key,end:a.currentTime+buf.duration/src.playbackRate.value};
  COMM.cur=cur;
  if(role==='ra') duckMusic(true);
  src.onended=()=>{ if(COMM.cur===cur){ COMM.cur=null; if(role==='ra') duckMusic(false); commNext(); } };
  src.start(a.currentTime+0.01);
}
function commNext(){
  const now=performance.now();
  while(COMM.queue.length){
    const it=COMM.queue.shift();
    if(now-it.at<(it.keep||1600)){ setTimeout(()=>commStart(it),it.gap||60); return; }
  }
}
/* prio: 1 chatter, 2 call, 3 must-hear. delay in ms. */
function vo(key,prio,delay){
  if(!voxOn||!sndOn) return;
  if(typeof VO_DATA==='undefined'||!VO_DATA[key]) return;
  prio=prio||1;
  if(delay){ setTimeout(()=>vo(key,prio,0),delay); return; }
  if(!actx()) return;
  if(!COMM.ready && !COMM.loading) commInit();
  const it={key,prio,at:performance.now()};
  if(!COMM.cur){ commStart(it); return; }
  if(prio>COMM.cur.prio){ const keep=COMM.queue.filter(q=>q.prio>=prio); commStop(); COMM.queue.push(...keep); commStart(it); return; }
  if(prio>=2 || COMM.queue.length===0){ it.keep=prio>=3?5000:1600; COMM.queue.push(it); if(COMM.queue.length>3) COMM.queue.shift(); }
}
function voSeq(keys,prio){              // e.g. "Here is your winner..." + name
  if(!voxOn||!sndOn) return;
  commStop();
  keys.forEach((k,i)=>{ if(i===0) vo(k,prio||3); else COMM.queue.push({key:k,prio:prio||3,at:performance.now(),keep:8000,gap:140}); });
}
/* last resort: the device's own voice, picked for quality */
const FB_TEXT={};
function commFallback(key){
  try{
    if(!voxOn) return;
    const txt=FB_TEXT[key]; if(!txt) return;
    if(!COMM.fb){
      const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
      const rank=v=>(/natural|neural|enhanced|premium/i.test(v.name)?4:0)+(/google uk english male|daniel|alex|arthur|aaron/i.test(v.name)?3:0)+(/google/i.test(v.name)?1:0);
      COMM.fb=vs.sort((a,b)=>rank(b)-rank(a))[0]||null;
    }
    const u=new SpeechSynthesisUtterance(txt);
    if(COMM.fb) u.voice=COMM.fb;
    u.rate=VO_ROLE(key)==='ra'?0.92:1.08; u.pitch=VO_ROLE(key)==='ra'?0.8:1.0;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

const IN={
  down:false, x:0, y:0, sx:0, sy:0, t0:0,
  ang:0, spinAcc:0, spinRate:0, moved:0, spinSgn:0, revFrame:0, domAcc:0, revCtx:false,
  tap:false, flick:null, flickPow:0, holding:false, run:false

let lastTouch={x:0,y:0,any:false,tapAll:false};
function ptr(e){
  const r=cv.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  if(!t) return null;
  return { x:(t.clientX-r.left)*(W/r.width), y:(t.clientY-r.top)*(H/r.height) };
}
function onDown(e){
  e.preventDefault(); actx(); if(!COMM.loading) commInit();
  const p=ptr(e); if(!p) return;
  if(SCREEN==='match' && onRunB(p)){ IN.run=true; RUNB.flash=0.2; return; }
  lastTouch.x=p.x; lastTouch.y=p.y; lastTouch.any=true;
  IN.down=true; IN.x=p.x; IN.y=p.y; IN.sx=p.x; IN.sy=p.y; IN.t0=performance.now();
  IN.ang=Math.atan2(p.y-DIAL.y,p.x-DIAL.x); IN.moved=0; IN.spinAcc=0; IN.holding=true;
}
function onMove(e){
  e.preventDefault(); if(!IN.down) return;
  const p=ptr(e); if(!p) return;
  IN.moved=Math.max(IN.moved,Math.hypot(p.x-IN.sx,p.y-IN.sy));
  const a=Math.atan2(p.y-DIAL.y,p.x-DIAL.x);
  let d=a-IN.ang; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2;
  const dist=Math.hypot(p.x-DIAL.x,p.y-DIAL.y);
  if(dist>12 && dist<DIAL.r+34){ IN.spinAcc+=Math.abs(d); IN.spinSgn+=d; }
  IN.ang=a; IN.x=p.x; IN.y=p.y;
}
function onUp(e){
  e.preventDefault(); if(!IN.down) return;
  IN.down=false; IN.holding=false;
  const dt=performance.now()-IN.t0;
  const dx=IN.x-IN.sx, dy=IN.y-IN.sy, d=Math.hypot(dx,dy);
  lastTouch.tapAll=(d<14&&dt<400);
  if(d<14 && dt<400){ IN.tap=true; }
  else if(d>=18 && dt<520){
    const a=Math.atan2(dy,dx);
    let dir;
    if(a>-Math.PI*0.75 && a<-Math.PI*0.25) dir='up';
    else if(a>Math.PI*0.25 && a<Math.PI*0.75) dir='down';
    else if(Math.abs(a)<=Math.PI*0.25) dir='right';
    else dir='left';
    IN.flick=dir; IN.flickPow=clamp(d/90,0.2,1);
  }
}

  const T=getPose(w.pose,w);

const add2=(o,th,l)=>[o[0]+Math.sin(th)*l, o[1]-Math.cos(th)*l];
function rigPoints(p,s){
  const J={}, A={};
  const tA=p.rot+p.pel, tC=tA+p.chest, tH=tC+p.head;
  A.tA=tA; A.tC=tC; A.tH=tH; A.rot=p.rot;
  J.pel=[0,0];
  J.abd=add2(J.pel,tA,13*s);
  J.chest=add2(J.abd,tC,15*s);
  J.neck=add2(J.chest,tH,3.5*s);
  J.head=add2(J.neck,tH,8.2*s);
  const sh=add2(J.chest,tC+Math.PI,3.4*s);
  J.shN=add2(sh,tC+Math.PI/2,1.0*s);
  J.shF=add2(sh,tC-Math.PI/2,3.0*s);

    const tF=tU-p['el'+k],          ha=add2(el,tF,15*s);

    const hip=add2(J.pel,p.rot+Math.PI/2,(k==='N'?1.6:-1.6)*s);
    const tT=p.rot+Math.PI-p['hip'+k], kn=add2(hip,tT,21*s);

}

  const R=core?RAD_CORE:RAD_ALL; let m=-1e9;

function mixHex(a,b,t){
  const A=parseInt(a.slice(1),16), B=parseInt(b.slice(1),16);
  const r=Math.round(((A>>16)&255)*(1-t)+((B>>16)&255)*t);
  const g=Math.round(((A>>8)&255)*(1-t)+((B>>8)&255)*t);
  const bl=Math.round((A&255)*(1-t)+(B&255)*t);
  return '#'+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);
}
function palette(d){
  if(d._pal) return d._pal;
  const p={
    skin:d.skin, skinD:shade(d.skin,0.72), skinL:mixHex(d.skin,'#FFFFFF',0.38), skinS:shade(d.skin,0.84),
    trunks:d.trunks, trunksD:shade(d.trunks,0.7),
    boots:d.boots, bootsD:shade(d.boots,0.7),
    acc:d.accent, accD:shade(d.accent,0.7),
    hair:d.hair, hairD:shade(d.hair,0.62), hairL:mixHex(d.hair,'#FFFFFF',0.3),
    wrist:d.wrist||'#F0F0F0'
  };
  if(d.pants){ p.pants=d.pants; p.pantsD=shade(d.pants,0.7); }
  if(d.coat){ p.coat=d.coat; p.coatD=shade(d.coat,0.7); p.coatL=mixHex(d.coat,'#FFFFFF',0.18); }
  if(d.singlet){ p.singlet=d.singlet; p.singletL=mixHex(d.singlet,'#FFFFFF',0.16); }
  d._pal=p; return p;
}

/* ---------- smooth shape primitives (world coords) ---------- */
const OUT='#0A0710';
function capPath(a,b,ra,rb){
  const dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy)||0.0001;
  const nx=-dy/L, ny=dx/L;
  ctx.beginPath();
  ctx.moveTo(a[0]+nx*ra,a[1]+ny*ra); ctx.lineTo(b[0]+nx*rb,b[1]+ny*rb);
  ctx.lineTo(b[0]-nx*rb,b[1]-ny*rb); ctx.lineTo(a[0]-nx*ra,a[1]-ny*ra);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(a[0],a[1],ra,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(b[0],b[1],rb,0,Math.PI*2); ctx.fill();
}
function cap(a,b,ra,rb,col){ ctx.fillStyle=col; capPath(a,b,ra,rb); }
function capO(a,b,ra,rb,col,ol){ ol=ol||1.5; cap(a,b,ra+ol,rb+ol,OUT); cap(a,b,ra,rb,col); }
function dot(c,r,col){ ctx.fillStyle=col; ctx.beginPath(); ctx.arc(c[0],c[1],r,0,Math.PI*2); ctx.fill(); }
function dotO(c,r,col,ol){ dot(c,r+(ol||1.5),OUT); dot(c,r,col); }
const lp=(a,b,t)=>[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
const off=(o,v,k)=>[o[0]+v[0]*k, o[1]+v[1]*k];
function hiLite(a,b,ra,rb,col,lift){ // rounded highlight toward the light (up-left)
  const L=[-0.45,-0.89];
  cap(off(a,L,ra*(lift||0.42)),off(b,L,rb*(lift||0.42)),ra*0.42,rb*0.42,col);
}
function shadowE(x,y,rx,a){
  ctx.fillStyle='rgba(0,0,0,'+a+')';
  ctx.beginPath(); ctx.ellipse(x,y,rx,rx*0.24,0,0,Math.PI*2); ctx.fill();
}

/* ============================================================
   DRAW A WRESTLER
   ============================================================ */
function drawWrestler(w){
  const d=w.def, f=w.face||1, s=(d.big?1.13:1)*(d.s||1);
  const pal=palette(d);
  let p=updatePose(w);
  if(w.rot){ p=Object.assign({},p); p.rot+=w.rot*f; }
  const {J,A}=rigPoints(p,s);
  const z=w.z||0;
  const oy=(MAT_Y+(w.gy||0)-z)-lowestY(J,s,!!w.drive);
  const ox=w.x;
  const G={}; for(const k in J) G[k]=[ox+f*J[k][0], oy+J[k][1]];
  // world-space direction vectors
  const dirW=(th)=>[f*Math.sin(th), -Math.cos(th)];
  const upB=dirW(A.tC), fwdB=dirW(A.tC+Math.PI/2), backB=[-fwdB[0],-fwdB[1]];
  const upA=dirW(A.tA), fwdA=dirW(A.tA+Math.PI/2);
  const upH=dirW(A.tH), fwdH=dirW(A.tH+Math.PI/2), dnH=[-upH[0],-upH[1]];

  // hair lag — the tip trails head motion
  if(w.cur){
    const hp=G.head;
    if(w._hp){ const vx=(hp[0]-w._hp[0]), vy=(hp[1]-w._hp[1]);
      w._hl=w._hl||[0,0];
      w._hl[0]=lerp(w._hl[0],clamp(-vx*2.2,-9,9),0.18); w._hl[1]=lerp(w._hl[1],clamp(-vy*1.4,-6,6),0.18); }
    w._hp=hp.slice();
  }
  const lag=w._hl||[0,0];

  // ---- shadow
  const sx=(G.pel[0]+G.chest[0])/2;
  shadowE(sx, MAT_Y+2+(w.gy||0), (19+z*0.05)*s, clamp(0.36-z*0.0028,0.10,0.36));

  // ---- coat tails (behind everything)
  if(d.coat){
    const a=off(G.abd,backB,6*s), e=off(off(G.pel,dirW(A.rot+Math.PI),26*s),backB,8*s);
    capO(a,[e[0]+lag[0]*0.6,e[1]],8*s,6*s,pal.coatD);
  }
  // ---- long mane (behind torso)
  if(d.hairStyle==='long'){
    const a=off(off(G.head,fwdH,-4*s),upH,2*s);
    const e=off(off(G.neck,fwdH,-7*s),dnH,15*s);
    capO(a,[e[0]+lag[0],e[1]+lag[1]],7.4*s,5.0*s,pal.hairD);
  }

  // ---- far limbs (darker)
  drawLeg(G,'F',true,s,d,pal);
  drawArm(G,'F',true,s,d,pal);

  // ---- torso
  const body = d.coat? pal.coat : d.singlet? pal.singlet : d.shirt? '#F2F2F2' : pal.skin;
  cap(G.pel,G.abd,11.7*s,12.1*s,OUT); cap(G.abd,G.chest,12.5*s,14.1*s,OUT);
  cap(G.pel,G.abd,10.2*s,10.6*s,body); cap(G.abd,G.chest,11.0*s,12.6*s,body);
  if(!d.shirt){
    // back shadow + front highlight give the torso roundness
    const shd = d.coat?pal.coatD : d.singlet? shade(d.singlet,0.75) : pal.skinS;
    cap(off(G.pel,backB,5*s),off(G.chest,backB,6.5*s),4.8*s,5.6*s,shd);
    const hl = d.coat?pal.coatL : d.singlet? pal.singletL : pal.skinL;
    cap(off(lp(G.abd,G.chest,0.25),fwdB,4*s),off(off(G.chest,fwdB,4.5*s),upB,-2*s),2.4*s,3*s,hl);
  }
  if(!d.coat && !d.singlet && !d.shirt){
    // pec + abs
    const pec=off(lp(G.abd,G.chest,0.62),fwdB,5.6*s);
    dot(pec,6.6*s,pal.skin);
    cap(off(pec,upB,-6*s),off(off(pec,upB,-6.2*s),fwdB,-6*s),1.0*s,1.0*s,pal.skinD);
    dot(off(pec,upB,1.5*s),3.0*s,pal.skinL);
    for(let i=0;i<2;i++){
      const c=off(lp(G.pel,G.abd,0.55+i*0.38),fwdB,7*s);
      cap(c,off(c,fwdB,-3.2*s),0.8*s,0.8*s,pal.skinD);
    }
  }
  if(d.singlet){ // skin at the chest opening
    cap(off(G.chest,fwdB,3*s),off(lp(G.abd,G.chest,0.7),fwdB,4*s),4.2*s,3*s,pal.skin);
  }
  if(d.coat){ // open coat shows the chest
    cap(off(lp(G.abd,G.chest,0.2),fwdB,7.5*s),off(G.chest,fwdB,8*s),2.8*s,3.6*s,pal.skin);
  }
  if(d.shirt){ // referee stripes
    for(const o of [-6,0,6]) cap(off(G.pel,fwdB,o*s),off(G.chest,fwdB,o*s),1.1*s,1.1*s,'#181818');
  }
  // trunks / kilt / pants waist
  if(d.kilt){
    const wL=off(lp(G.pel,G.abd,0.35),fwdA,-11.5*s), wR=off(lp(G.pel,G.abd,0.35),fwdA,11.5*s);
    const dn=dirW(A.rot+Math.PI);
    const hL=off(off(G.pel,dn,17*s),fwdA,-14*s), hR=off(off(G.pel,dn,17*s),fwdA,14*s);
    ctx.fillStyle=OUT; ctx.beginPath();
    ctx.moveTo(wL[0],wL[1]); ctx.lineTo(wR[0],wR[1]); ctx.lineTo(hR[0]+1,hR[1]+1.5); ctx.lineTo(hL[0]-1,hL[1]+1.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle=pal.trunks; ctx.beginPath();
    ctx.moveTo(wL[0],wL[1]+1); ctx.lineTo(wR[0],wR[1]+1); ctx.lineTo(hR[0],hR[1]); ctx.lineTo(hL[0],hL[1]); ctx.closePath(); ctx.fill();
    for(let i=1;i<4;i++){ const t=i/4; cap(lp(wL,wR,t),lp(hL,hR,t),0.8*s,0.8*s,'#F0E8D0'); }
    cap(lp(wL,hL,0.55),lp(wR,hR,0.55),0.9*s,0.9*s,'#1A1A1A');
  } else {
    const top=lp(G.pel,G.abd,0.46);
    capO(G.pel,top,11.0*s,10.9*s,d.pants?pal.pants:pal.trunks,1.3);
    cap(lp(G.pel,G.abd,0.40),top,11.0*s,10.9*s,d.pants?'#101010':pal.acc);
  }

  // ---- near leg
  drawLeg(G,'N',false,s,d,pal);

  // ---- head
  drawHead(G,s,d,pal,w,{upH,fwdH,dnH,upB,fwdB,lag});

  // ---- near arm (in front of everything)
  drawArm(G,'N',false,s,d,pal);
}

function drawLeg(G,k,far,s,d,pal){
  const hip=G['hip'+k], kn=G['kn'+k], an=G['an'+k], toe=G['toe'+k];
  const legCol = d.pants? (far?pal.pantsD:pal.pants) : (far?pal.skinD:pal.skin);
  capO(hip,kn,8.4*s,6.4*s,legCol);
  if(!far && !d.pants) hiLite(hip,kn,8.4*s,6.4*s,pal.skinL);
  capO(kn,an,6.6*s,4.8*s,legCol);
  if(!d.kilt && !d.pants) capO(hip,lp(hip,kn,0.36),9.0*s,7.8*s,far?pal.trunksD:pal.trunks,1.2);
  const bc=far?pal.bootsD:pal.boots;
  const bt=lp(kn,an,0.40);
  capO(bt,an,5.9*s,5.4*s,bc);
  capO(an,toe,5.0*s,3.9*s,bc);
  cap(bt,lp(bt,an,0.14),6.0*s,5.9*s,far?pal.accD:pal.acc);
  if(!far){ cap(lp(an,toe,0.1),lp(an,toe,0.95),1.1*s,1.0*s,shade(d.boots,0.55));
            dot(lp(bt,an,0.55),1.1*s,'#E8E8E8'); }
  if(!d.pants){ dotO(kn,6.1*s,far?pal.accD:pal.acc,1.3);
                if(!far) dot(off(kn,[-0.45,-0.89],2.2*s),2.2*s,mixHex(d.accent,'#FFFFFF',0.4)); }
}
function drawArm(G,k,far,s,d,pal){
  const sh=G['sh'+k], el=G['el'+k], ha=G['ha'+k];
  const col=far?pal.skinD:pal.skin;
  const sleeve = d.shirt? (far?'#B0B0B0':'#F2F2F2') : null;
  dotO(sh,7.0*s,sleeve||col);
  capO(sh,el,6.4*s,5.0*s,sleeve||col);
  if(!sleeve){
    const dir=[ha[0]-el[0],ha[1]-el[1]], L=Math.hypot(dir[0],dir[1])||1;
    const mid=off(lp(sh,el,0.46),[dir[0]/L,dir[1]/L],2.2*s);
    dot(mid,5.0*s,col);
    if(!far){ hiLite(sh,el,6.4*s,5.0*s,pal.skinL); dot(off(sh,[-0.45,-0.89],2.6*s),2.6*s,pal.skinL); }
  }
  capO(el,ha,5.1*s,3.9*s,col);
  if(!far && !sleeve) hiLite(el,ha,5.1*s,3.9*s,pal.skinL,0.36);
  cap(lp(el,ha,0.70),lp(el,ha,0.90),4.6*s,4.3*s,far?shade(pal.wrist,0.72):pal.wrist);
  dotO(ha,5.0*s,col);
  if(!far) dot(off(ha,[-0.45,-0.89],1.8*s),1.8*s,pal.skinL);
}
function drawHead(G,s,d,pal,w,V){
  const {upH,fwdH,dnH,lag}=V;
  const hd=G.head, nk=G.neck;
  const P=(a,b)=>[hd[0]+fwdH[0]*a*s+upH[0]*b*s, hd[1]+fwdH[1]*a*s+upH[1]*b*s];
  // neck
  capO(lp(G.abd,G.chest,0.92),nk,6.6*s,5.8*s,pal.skin);
  cap(off(lp(G.abd,G.chest,0.92),fwdH,-2*s),off(nk,fwdH,-2*s),3*s,2.6*s,pal.skinS);
  if(d.collar){ const a=lp(G.shF,G.abd,0.12), b=lp(G.shN,G.abd,0.12);
    capO(a,b,5.2*s,5.2*s,pal.hair,1.2); cap(a,b,3.0*s,3.0*s,d.accent); cap(a,b,1.3*s,1.3*s,pal.hair); }

  // big hair behind the head
  if(d.hairStyle==='afro'){ dotO(P(-1.5,2.5),12.6*s,pal.hair,1.6); dot(P(-3,5),6*s,pal.hairL); }
  if(d.hairStyle==='wild'){
    for(let i=0;i<6;i++){
      const ang=Math.PI*0.42+i*(Math.PI*0.62/5);
      const len=12.5-Math.abs(i-2.5)*0.8;
      const tip=P(Math.cos(ang)*len, Math.sin(ang)*len);
      const tp=[tip[0]+lag[0]*0.5,tip[1]+lag[1]*0.5];
      capO(P(-1.2,2.2),tp,4.4*s,1.3*s,pal.hair,1.4);
    }
  }
  if(d.hairStyle==='nemes'){            // royal headcloth: lappets fall behind the shoulders
    const low=off(nk,fwdH,-7*s);
    const A0=P(-2.5,2.5), E0=[low[0]+lag[0]*0.4,low[1]+9*s+lag[1]*0.3];
    capO(A0,E0,10.6*s,7.4*s,pal.hair,1.6);
    const ax=E0[0]-A0[0], ay=E0[1]-A0[1], al=Math.hypot(ax,ay)||1, nx=-ay/al, ny=ax/al;
    for(const u of [0.42,0.62,0.82]){ const cx=lerp(A0[0],E0[0],u), cy=lerp(A0[1],E0[1],u), hw=lerp(10.6,7.4,u)*s*0.92;
      cap([cx-nx*hw,cy-ny*hw],[cx+nx*hw,cy+ny*hw],1.5*s,1.5*s,d.accent); }
  }
  // skull + jaw
  const chin=P(4.4,-5.4);
  dot(hd,10.2*s,OUT); cap(hd,chin,10.2*s,7.2*s,OUT);
  dot(hd,8.6*s,pal.skin); cap(hd,chin,8.6*s,5.6*s,pal.skin);
  // hair cap on top/back
  if(d.hairStyle!=='afro' && d.hairStyle!=='bald'){
    dot(P(-1.8,1.6),8.5*s,pal.hair);
    dot(P(1.9,-0.8),7.4*s,pal.skin); cap(P(1.9,-0.8),chin,7.4*s,5.6*s,pal.skin);
    dot(P(-3.2,4.2),2.6*s,pal.hairL);
  }
  if(d.hairStyle==='afro'){ dot(P(1.4,-0.4),7.6*s,pal.skin); }
  if(d.hairStyle==='nemes'){
    for(const dy of [5.2,7.8]){ const hw=Math.sqrt(Math.max(0,8.5*8.5-(dy-1.6)*(dy-1.6)))-1.2; cap(P(-1.8-hw,dy),P(Math.min(-1.8+hw,3.5),dy),1.0*s,1.0*s,d.accent); }
    cap(P(-7.6,3.2),P(6.8,4.4),1.8*s,1.6*s,d.accent);
    cap(P(-7.6,3.2),P(6.8,4.4),0.7*s,0.6*s,pal.hair);
    dotO(P(8.4,5.0),2.2*s,pal.hair,1.0); dot(P(8.4,5.0),1.0*s,d.accent);
  }
  // ear
  dotO(P(-1.6,-0.6),2.2*s,pal.skinD,1.1);
  // jaw shading
  cap(P(-1,-5),P(3,-7),2.6*s,2*s,pal.skinS);
  // war paint
  if(d.paint){
    cap(P(1.5,2.6),P(8.2,2.0),2.2*s,1.6*s,d.paint);
    cap(P(3,-1),P(7.6,-3.4),1.6*s,1.2*s,d.paint);
    cap(P(-3,6.8),P(2,7.6),1.6*s,1.4*s,d.paint);
  }
  // brow, eye
  if(w) w._eye=P(5.6,0.6);
  if(w) w._haN=G.haN;
  const hurt=w&&w.hurt>0.25;
  if(d.shades){
    cap(P(2.6,0.9),P(8.6,0.6),2.5*s,2.2*s,'#0A0A12');
    dot(P(6.8,1.6),0.9*s,'#8090C0');
  } else if(hurt){
    cap(P(4.2,0.4),P(7.0,-0.2),0.8*s,0.8*s,OUT);
  } else {
    dot(P(5.6,0.6),1.9*s,'#FFFFFF'); dot(P(6.3,0.5),1.15*s,'#101018');
  }
  cap(P(3.4,hurt?2.0:2.8),P(7.8,hurt?3.2:2.6),1.15*s,1.0*s,pal.hairD);
  // nose
  dotO(P(8.6,-1.6),1.8*s,pal.skin,1.0);
  // mouth
  if(hurt || (w&&(w.pose==='lockup'))) dot(P(6.6,-4.6),1.7*s,'#401018');
  else cap(P(5.4,-4.8),P(7.4,-4.4),0.75*s,0.75*s,OUT);
  // facial hair
  if(d.tash){
    cap(P(5.2,-3.2),P(8.4,-3.3),1.7*s,1.5*s,pal.hair);
    cap(P(7.8,-3.4),P(6.9,-7.6),1.5*s,1.3*s,pal.hair);
    cap(P(5.6,-3.3),P(4.9,-7.2),1.4*s,1.1*s,pal.hair);
  }
  if(d.beard){
    cap(P(-0.5,-4.2),P(5.6,-7.6),4.0*s,3.2*s,pal.hair);
    cap(P(5,-3.4),P(8.2,-3.6),1.5*s,1.3*s,pal.hair);
  }
  // headwear
  if(d.bandana){
    cap(P(-6.4,4.6),P(6.2,6.8),3.6*s,2.8*s,d.bandana);
    cap(P(-6.4,4.6),P(6.2,6.8),1.0*s,0.8*s,mixHex(d.bandana,'#FFFFFF',0.35));
    const kt=P(-8,3);
    capO(kt,[kt[0]-fwdH[0]*5*s+lag[0]*0.8,kt[1]+5*s+lag[1]*0.6],2.2*s,1.3*s,d.bandana,1.1);
  } else if(d.hairStyle==='short'||d.hairStyle==='wild'){
    cap(P(-7.4,3.4),P(6.2,4.6),1.6*s,1.5*s,d.accent);
  }
}

/* ============================================================
   REFEREE — same rig, his own outfit
   ============================================================ */
const REF={ name:'REF', skin:'#E8B888', hair:'#3A3028', hairStyle:'short', tash:false, beard:false,
  trunks:'#202028', boots:'#141414', accent:'#202028', pants:'#202028', shirt:true, s:0.92,
  wrist:'#E8B888' };

/* ============================================================
   RING
   ============================================================ */
let crowdSeed=[];
for(let i=0;i<440;i++) crowdSeed.push({
  x:rnd(-214,470), y:rnd(0,50),
  c:['#584870','#48406A','#6A5480','#3C3458','#705C88'][Math.floor(Math.random()*5)],
  s:['#C0A0D0','#A088C0','#D0B8E0'][Math.floor(Math.random()*3)],
  p:rnd(0,6.28), sp:rnd(2,4)
});
crowdSeed.sort((a,b)=>a.y-b.y);
const SIGNS=[{x:28,y:10},{x:150,y:4},{x:204,y:22},{x:84,y:34},{x:-150,y:14},{x:-74,y:30},{x:296,y:8},{x:384,y:26}];
let flashT=0, flashes=[];
function drawRing(t,shk){
  shk=shk||0;
  px(-230,RING_Y-80,716,RING_H+190,'#0A0812');
  // spotlight cones
  ctx.fillStyle='rgba(200,180,255,0.05)';
  for(let i=-4;i<9;i++){ ctx.beginPath(); ctx.moveTo(24+i*52,RING_Y); ctx.lineTo(-40+i*52,MAT_Y+16); ctx.lineTo(90+i*52,MAT_Y+16); ctx.closePath(); ctx.fill(); }
  // lighting rig
  for(let i=-6;i<13;i++){ px(10+i*38,RING_Y,6,4,'#F8F0C0'); px(11+i*38,RING_Y+4,4,2,'#807020'); }

  // crowd
  for(const c of crowdSeed){
    const b=Math.sin(t*c.sp+c.p)*1.8;
    const yy=RING_Y+4+c.y*1.05+b;
    px(c.x,yy+4,5,6,c.c);
    disc(c.x+2,yy+2,2.6,c.s);
    if(((c.p*100|0)%7)===0) px(c.x+1,yy-4,3,4,'#F8D818');
  }

    M.parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-30,t:0,life:rnd(0.35,0.7),

  for(const p of M.parts){

  }
}

function physics(dt){
  for(const w of [M.p,M.c,M.ref]){
    if(!w.drive && !w.trans){
      if(!w.noPhys) w.x += w.vx*dt;
      if(!w.running) w.vx *= Math.pow(0.012,dt);
      if(Math.abs(w.vx)<2) w.vx=0;
      const [L,R]=w.def===REF?[RING_L+14,RING_R-14]:levelBounds(w);
      if(w.x<L && !w.noPhys){ w.x=L; if(w.def!==REF){ w.vx=Math.abs(w.vx)*0.3; M.ropeShake=Math.max(M.ropeShake,0.6);} }
      if(w.x>R && !w.noPhys){ w.x=R; if(w.def!==REF){ w.vx=-Math.abs(w.vx)*0.3; M.ropeShake=Math.max(M.ropeShake,0.6);} }
    }
    w.animT+=dt;
    // feet match ground speed — no skating
    w.walkPh += dt*(Math.abs(w.vx)*0.09+(w.running?2:0))*(Math.sign(w.vx*w.face)||1);
    if(w.hurt!==undefined) w.hurt=Math.max(0,w.hurt-dt);
    if(w.guard!==undefined) w.guard=Math.max(0,w.guard-dt);
    if(w.fired>0) w.fired-=dt;
    if(w.duck>0) w.duck-=dt;
    if(w.catchT>0){ w.catchT-=dt; if(w.catchT<=0 && w.intent==='grab' && w.cpu) w.intent='idle'; }
    if(w.sta!==undefined) w.sta=clamp(w.sta+dt*15,0,100);
    if(w.rotT!==undefined) w.rot=lerp(w.rot,w.rotT||0,1-Math.exp(-dt*12));
    if(w.daze) w.daze=Math.max(0,w.daze-dt*0.22);
    if(w.getup>0){ w.getup-=dt; if(w.getup<=0){ w.getup=0; w.pose='ready'; } }
  }
}
function updRef(dt){
  const r=M.ref;
  if(updRefBump(r,dt)) return;
  const outW = M.phase!=='intro' && M.phase!=='over' && !(M.cine&&M.cine.kind==='end') && [M.p,M.c].find(w=>w.out&&!w.trans);
  if(outW && M.phase!=='pin'){
    const side=outW.out, tx=ringEdgeX(side)-side*4;
    r.face=side;
    if(Math.abs(tx-r.x)>6){ r.vx=clamp((tx-r.x)*5,-150,150); r.pose='walk'; }
    else { r.vx=0; r.pose=M.noDQ?'refIdle':'refOut'; r.countPh=(M.count||0)%1; }
  } else if(M.phase==='pin' || (M.cine&&M.cine.kind==='end'&&M.cine.stage!=='stand'&&M.cine.how!=='countout'&&M.pin&&M.pin.def)){
    const d=M.pin.def;
    let tx = r.x>d.x? d.x+62 : d.x-62;
    if(tx<RING_L+14||tx>RING_R-14) tx = r.x>d.x? d.x-62 : d.x+62;
    tx=clamp(tx,RING_L+14,RING_R-14);
    r.face = d.x>r.x?1:-1;
    if(Math.abs(tx-r.x)>6){ r.vx=clamp((tx-r.x)*8,-240,240); r.pose='run'; }
    else { r.vx=0; r.pose='refCount'; r.countPh=M.pin.cd; }
  } else if(M.phase==='intro'){
    r.face=-1; const tx=128;
    if(Math.abs(tx-r.x)>6){ r.vx=clamp((tx-r.x)*3,-95,95); r.pose='walk'; } else { r.vx=0; r.pose='refIdle'; }
  } else {
    const mid=(M.p.x+M.c.x)/2, L=RING_L+16, R=RING_R-16;
    // pick the spot with the most room from both wrestlers, preferring to stay put
    let tx=r.x, best=-1e9;
    for(let x=L; x<=R; x+=12){
      const room=Math.min(Math.abs(x-M.p.x),Math.abs(x-M.c.x),90);
      const sc=room-0.25*Math.abs(x-r.x);

    }
    r.face = mid>r.x?1:-1;
    if(Math.abs(tx-r.x)>10){ r.vx=lerp(r.vx,clamp((tx-r.x)*3,-95,95),1-Math.exp(-dt*6)); r.pose='walk'; }
    else { r.vx*=0.8; r.pose='refIdle'; }
  }
}
function update(dt){
  if(!M) return;
  RDT=dt;
  if(M.replay){ updReplay(); return; }
  updCine();
  if(M.cine){ IN.tap=false; IN.flick=null; }
  dt*=M.slow;
  if(M.intf&&M.intf.st==='swing') dt*=0.55;
  if(M.phase==='move'&&M.move&&M.move.rev&&M.move.rev.state==='open'&&M.move.def===M.p) dt*=0.5;
  lastDt=dt;
  M.thud=Math.max(0,M.thud-dt*2.6);
  if(M.hitstop>0){ M.hitstop-=dt; M.shake*=0.92; FREEZE=true; return; }
  FREEZE=false;
  M.t+=dt;
  M.shake*=0.86; M.flash=Math.max(0,M.flash-RDT*4);
  M.msgT=Math.max(0,M.msgT-dt);
  M.ropeShake=Math.max(0,M.ropeShake-dt*2.2);
  for(const f of M.fx) f.t+=dt;
  M.fx=M.fx.filter(f=>f.t<1);
  updParts(dt);
  physics(dt);
  updTrans(M.p,dt); updTrans(M.c,dt);
  if(['neutral','lockup','move','ground'].includes(M.phase)) updCount(dt);
  if(!M) return;
  if(M.phase==='move'&&M.move&&M.move.kind==='pickUp'&&M.move.def===M.p&&IN.tap) M.move.fight=true;
  updComeback(dt);
  if(M.phase==='neutral') maybeRefBump();
  if(M.intf && M.phase!=='intro') updIntf(dt);
  if(!M) return;
  trackLead(dt);
  updRef(dt);
  chairUpdate(dt);

  switch(M.phase){
    case 'intro': updIntro(dt); break;
    case 'neutral': updNeutral(dt); break;
    case 'lockup': updLockup(dt); break;
    case 'move': updMove(dt); break;
    case 'ground': updGround(dt); break;
    case 'pin': updPin(dt); break;
    case 'over': updOver(dt); break;
  }
  if(M) recordFrame(dt);
  eatInput();
}

      w.x+=dir*Math.min(Math.abs(tx-w.x),110*dt);
      w.pose=Math.abs(tx-w.x)>2?'walk':'ready';
    } else {
      w.x=tx; w.vx=0; w.face = w===M.p?1:-1;
      w.pose = w===M.p? (w.def.entPose2||'taunt') : (w.def.entPose||'taunt');
      if(w.pose==='idle') w.pose='win';
    }
  }
  // turnbuckle pyro in each man's colours
  if(t>1.45 && t<2.6){
    if(!M.pyro){ M.pyro=1; SFX.boom(); crowd(1,1.8); M.flash=0.5; msg('LETS GET READY',1.4); }
    for(const [x,w] of [[16,M.p],[240,M.c]]) for(let k=0;k<3;k++){
      const col=w.def.pyroCol[k%2];
      M.parts.push({x:x+rnd(-2,2),y:272,vx:rnd(-30,30),vy:rnd(-230,-160),t:0,life:rnd(0.6,1.0),c:col,s:rnd(2,3),star:false});
    }
  }
  if(t>=3.1){
    M.p.noPhys=false; M.c.noPhys=false;
    stopTheme(1.2); SFX.bell(); vo('ra_bell',3);
    toNeutral();
  }
}
function toNeutral(){
  M.phase='neutral';
  for(const w of [M.p,M.c]){ stopRun(w); standUp(w); w.rotT=0; w.intent='idle'; }
  M.c.aiT=0.45; M.move=null;
  faceEachOther();
  M.hint='';
}

/* ---------- NEUTRAL: continuous ---------- */
function updNeutral(dt){
  if(M.cine) return;
  if(!sameLevel()){
    if(!M.split){ M.split=1; M.c.splitT=0; M.c.outPlan=null; M.c.rollAt=0; M.p.wantIn=0; M.p.wantOut=0; M.c.wantIn=0; }
    updSplit(dt); return;
  }
  M.split=0;
  if(M.p.out) floorPlay(dt); else { M.p.wantIn=0; M.c.wantIn=0; M.c.floorT=0; M.c.floorAt=0; }
  faceEachOther();
  const p=M.p, c=M.c, d=dist();
  const runningAt=(w,o)=>w.run&&w.run.st==='back'&&!w.run.passed&&(o.x-w.x)*w.run.dir>0&&Math.abs(o.x-w.x)<110;

  /* ----- player ----- */
  if(p.run){
    if(IN.tap) p.run.atk=RUN_SIG[p.idx]||'runClothes';
    else if(IN.flick==='up') p.run.atk='dropkick';
  } else if(!busy(p)&&!p.wantIn){
    const held = IN.down && (performance.now()-IN.t0)>140;
    if(IN.run && !p.out){ startRun(p); }
    else if(IN.flick==='up' && !p.chair && nearChair(p)){ chairPick(p); }
    else if(IN.flick==='down' && runningAt(c,p)){ p.duck=0.5; p.pose='duck'; p.getup=0.5; }
    else if(IN.flick==='down'){ p.intent='block'; p.guard=0.55; }
    else if(IN.tap){ playerStrike(); return; }
    else if(held) p.intent='grab';
    else if(p.guard<=0) p.intent='idle';
  } else if(!(p.duck>0)) p.intent='idle';

  /* ----- CPU, by personality ----- */
  const st=styleOf(c);
  if(c.run){ /* committed */ }
  else if(!busy(c)&&!c.wantIn){
    c.aiT-=dt;
    if(c.aiT<=0){
      c.aiT=rnd(st.aiT[0],st.aiT[1])-M.cpuSkill*0.15;
      const r=Math.random();
      const refAway=Math.abs(M.ref.x-(p.x+c.x)/2)>60;
      if(c.chair) c.intent = r<0.65?'strike':'idle';
      else if(M.chair&&M.chair.state==='mat'&&!M.chair.bent&&!p.chair&&r<0.45) c.intent='chair';
      else if(c.mom>=100) c.intent='grab';
      else if(st.cheap && refAway && r<st.cheap) c.intent='cheap';
      else if(p.intent==='grab' && r<0.25+M.cpuSkill*0.35) c.intent='strike';
      else if(p.intent==='block' && r<0.35+M.cpuSkill*0.3) c.intent='grab';
      else {
        const q=Math.random(); let acc=0;
        const pick=[['strike',st.strike],['grab',st.grab],['block',st.block],['run',st.run]];
        c.intent='idle';
        for(const [k,v] of pick){ acc+=v; if(q<acc){ c.intent=k; break; } }
        if(c.intent==='run' && (d<44||c.out)) c.intent='strike';
      }
      if(c.intent==='block') c.guard=0.7;
      if(c.intent==='strike'||c.intent==='cheap') c.windup=0.34-M.cpuSkill*0.08;
      if(c.intent==='run'){ startRun(c); }
    }
    if(c.intent==='chair' && nearChair(c)){ chairPick(c); c.intent='idle'; }
    if(c.intent==='chair' && !(M.chair&&M.chair.state==='mat')) c.intent='idle';
    if(c.intent==='strike'||c.intent==='cheap'){
      c.windup-=dt;
      if(c.windup<=0 && d<CONTACT+8){
        if(c.intent==='cheap'){ c.intent='idle'; return runMove('eyeRake',c,p); }
        cpuStrike(); return;
      }
      if(c.windup<=0 && d>=CONTACT+8) c.intent='grab';
    }
  } else if(!(c.duck>0) && !(c.catchT>0)) c.intent='idle';

  /* ----- runners ----- */
  for(const w of [p,c]) if(w.run){ updRun(w,dt); if(M.phase!=='neutral') return; }

  /* ----- walking ----- */
  for(const w of [p,c]){
    if(w.run||w.wantIn) continue;
    if(busy(w)){ w.vx*=0.8; continue; }
    const o = w===p?c:p;
    const dir = w.x<o.x?1:-1;
    const space = w.cpu? styleOf(w).space : SPACE;
    let sp=0;
    if(w.intent==='chair'&&M.chair){ w.vx=lerp(w.vx,clamp((M.chair.x-w.x)*4,-80,80),1-Math.exp(-dt*10)); continue; }
    if(o.run && w.intent!=='grab'){ w.vx*=0.8; continue; }       // brace for the runner
    if(w.intent==='grab') sp=o.run?0:66+w.def.spd*3;
    else if(w.intent==='strike'||w.intent==='cheap') sp=34;
    else if(w.intent==='block') sp=-14;
    else sp = d>space? 34 : (d<space-18? -24 : 0);
    if(d<CONTACT-6 && sp>0) sp=0;
    w.vx = lerp(w.vx, sp*dir, 1-Math.exp(-dt*10));
  }
  const moving=w=>Math.abs(w.vx)>12;
  const poseFor=w=>{
    const mv=moving(w);
    if(w.run) return 'run';
    if(w.chair) return mv?'walkChair':'chairHold';
    if(w.intent==='grab')   return mv?'walkGrab':'tellGrab';
    if(w.intent==='block')  return mv?'walkBlock':'tellBlock';
    if(w.intent==='strike'||w.intent==='cheap') return mv?'walkStrike':'tellStrike';
    return mv?'walk':'ready';
  };
  if(!busy(p)&&!p.wantIn) p.pose=poseFor(p);
  if(!busy(c)&&!c.wantIn) c.pose=poseFor(c);

  if(d<CONTACT && !busy(p) && !busy(c) && !p.run && !c.run){
    const pg=p.intent==='grab', cg=c.intent==='grab';
    if(pg&&cg) return startLockup(0);
    if(pg&&c.intent!=='strike') return startLockup(0.15);
    if(cg&&p.intent!=='strike' && p.guard<=0) return startLockup(-0.30);
    if(cg&&p.intent==='block') return startLockup(-0.34);
  }
}
function playerStrike(){
  const d=dist();
  if(d>CONTACT+14){ M.p.vx=M.p.face*170; SFX.whoosh(); return; }
  if(M.p.chair) return runMove('chairShot',M.p,M.c);      // the chair goes straight through a block
  if(M.c.intent==='block'||M.c.guard>0){
    SFX.block(); fx(M.c.x,MAT_Y-96,'BLOCK',C.cyan); M.shake=3; M.hitstop=0.05;
    return runMove('counter',M.c,M.p);
  }
  runMove('punch',M.p,M.c);
}
function cpuStrike(){
  if(M.c.chair) return runMove('chairShot',M.c,M.p);
  if(M.p.intent==='block'||M.p.guard>0){
    SFX.block(); fx(M.p.x,MAT_Y-96,'BLOCK',C.cyan); M.shake=3; M.hitstop=0.05;
    M.p.mom=clamp(M.p.mom+8,0,100);
    return runMove('counter',M.p,M.c);
  }
  runMove('punch',M.c,M.p);
}

/* ---------- LOCKUP: hold, spin, release to throw ---------- */
function startLockup(adv){
  chairDrop(M.p); chairDrop(M.c);
  M.phase='lockup';
  M.lock={bal:adv,t:0,mid:(M.p.x+M.c.x)/2};
  M.p.pose='lockup'; M.c.pose='lockup';
  M.p.vx=0; M.c.vx=0;
  SFX.charge(); crowd(0.35,0.6);
  M.hint='SPIN, THEN FLICK TO THROW';
}
function updLockup(dt){
  const L=M.lock; L.t+=dt;
  faceEachOther();
  // ease into collar-and-elbow spacing (no snapping)
  const k=1-Math.exp(-dt*14);
  const pushX=L.bal*6;
  M.p.x=lerp(M.p.x, L.mid-M.p.face*LOCK_GAP/2+M.p.face*pushX, k);
  M.c.x=lerp(M.c.x, L.mid-M.c.face*LOCK_GAP/2+M.p.face*pushX, k);

  const pRate=clamp(IN.spinRate/14,0,1.35)*(0.70+M.p.sta/300)*(0.85+M.p.def.grp*0.035);
  if(L.grip===undefined) L.grip=rnd(0.8,1.2);              // some lockups he's just got you
  const cBase=(0.48+M.cpuSkill*0.57)*(0.85+M.c.def.grp*0.035)*L.grip;
  // he surges every so often: you have to spin hard through it
  if(L.surgeT===undefined){ L.surgeT=rnd(0.4,1.0); L.surge=0; }
  L.surgeT-=dt; if(L.surgeT<=0){ L.surge=0.7; L.surgeT=rnd(1.0,1.8)-M.cpuSkill*0.3; L.rev=0; }
  if(L.surge>0){
    L.surge-=dt; L.rev=(L.rev||0)+IN.revFrame;
    if(L.rev>2.2){                               // a third of a turn the "wrong" way: you use his push against him
      L.surge=0; L.rev=0; L.surgeT+=0.5; L.turned=(L.turned||0)+1;
      L.bal=Math.max(L.bal,LOCK_WIN+0.15);
      msg('TURNED IT AROUND!',1.0); fx(M.p.x,MAT_Y-104,'TURNED IT AROUND!',C.cyan);
      SFX.bighit(); M.shake=5; M.hitstop=0.06; crowd(0.8,1.0); M.flash=0.3;
      if(M.st) M.st.rev++;
    }
  }
  const cRate=cBase*(0.85+0.25*Math.sin(L.t*2.6)) + (L.surge>0?0.42+M.cpuSkill*0.38:0) + (M.c.fired>0?1.1:0) - (M.p.fired>0?1.3:0);
  if(IN.spinRate>3){ M.p.sta-=dt*11; if(Math.random()<0.22) SFX.spin(); }
  L.bal=clamp(L.bal+(pRate-cRate)*dt*1.15,-1,1);
  L.pR=pRate; L.cR=cRate; L.ss=(L.ss||0)+IN.spinRate*dt; L.pk=Math.max(L.pk||0,IN.spinRate);
  if(L.bal>LOCK_WIN && L.reachT===undefined) L.reachT=L.t;
  M.p.rotT=L.bal*0.10*M.p.face; M.c.rotT=-L.bal*0.10*M.c.face;

  if(IN.flick){
    if(L.bal>LOCK_WIN){
      lockLog(L,'W');
      const dir=IN.flick;
      if(dir==='up'){ if(M.p.mom>=100&&!M.p.out){ M.p.mom=0; return runMove('finisher',M.p,M.c,0); } return runMove(sigOf(M.p,0)[0],M.p,M.c); }
      if(dir==='down'){ if(M.p.mom>=100&&!M.p.out){ M.p.mom=0; return runMove('finisher',M.p,M.c,1); } return runMove(sigOf(M.p,1)[0],M.p,M.c); }
      const toward = (dir==='right') === (M.c.x>M.p.x);
      if(toward && canToss(M.p,M.c)) return runMove('overTop',M.p,M.c);
      return toward ? startWhip(M.p,M.c) : runMove('powerbomb',M.p,M.c);
    } else { lockLog(L,'X'); shoveOff(); return; }
  }
  if(IN.tap){ lockLog(L,'X'); shoveOff(); return; }
  if(L.bal<=-0.72){ lockLog(L,'L'); cpuThrow(); return; }
  if(L.t>5.5){ lockLog(L,'T'); if(L.bal>0) shoveOff(); else cpuThrow(); }
}
/* ---------- tuning log (hidden: tap the title logo) ---------- */
