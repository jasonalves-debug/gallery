<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Séance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout: a portrait room for a cocktail cab with the players at the short ends. The stage is turned to the
   monitor's long side and stretched to fill it edge to edge. Two overlay layers ride inside it: one upright for
   the bottom player, one turned 180° for the top player.
   Phone pages (?join=) replace the stage with a single scrolling column. */
:root{
  --void:#050408; --ink:#0d0b12; --paper:#e3d2a9; --paper2:#d6c59d; --dim:#8a7d64;
  --amber:#ffbf6e; --ecto:#8fe6ff; --blood:#7a1a18;
  --display:'IM Fell English SC','Iowan Old Style',Georgia,serif;
  --body:'IM Fell English','Iowan Old Style',Georgia,serif;
  --mono:ui-monospace,'Cascadia Mono',Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--void);color:var(--paper)}
[hidden]{display:none!important}
html.phone{background:var(--paper)} html.phone.gho{background:#06070d}
body.phone{height:auto;min-height:100%}
body:not(.phone){overflow:hidden;cursor:none}
#rot{position:absolute;left:50%;top:50%;transform-origin:50% 50%;overflow:hidden;background:#000}
#c{display:block;width:100%;height:100%}
#perf{position:absolute;left:.7em;top:30%;font:.62em/1.45 var(--mono);color:var(--dim);letter-spacing:.03em;white-space:pre;pointer-events:none;text-shadow:0 0 4px #000;z-index:5}
.layer{position:absolute;inset:0;pointer-events:none}
#Lt{transform:rotate(180deg)}
.layer .det{--acc:var(--amber)} .layer .gho{--acc:var(--ecto)}
.layer[data-role=det]{--acc:var(--amber)} .layer[data-role=gho]{--acc:var(--ecto)}

/* title: one seat card per side */
.seat{position:absolute;left:50%;bottom:1.1em;transform:translateX(-50%);display:flex;gap:1.3em;align-items:center;width:min(44em,95%);box-sizing:border-box;padding:.9em 1.2em;background:rgba(5,4,8,.78);border-top:1px solid color-mix(in srgb,var(--acc) 45%,transparent);border-bottom:1px solid color-mix(in srgb,var(--acc) 45%,transparent)}
.seat .qr{width:8.2em;height:8.2em;flex:none;border-radius:2px;transition:opacity .4s}
.seat h2{font:400 1.45em var(--display);letter-spacing:.12em;margin:0 0 .3em;color:var(--acc)}
.seat .how{font:.95em/1.45 var(--body);margin:0;color:var(--paper2)}
.seat .link{font:.78em/1.5 var(--mono);color:var(--dim);margin:.55em 0 0;letter-spacing:.02em}
.seat .link.ok{color:var(--acc)}
.rdy{font:1.05em var(--display);letter-spacing:.24em;margin:.5em 0 0;color:var(--paper);animation:breathe 2.6s ease-in-out infinite}
.rdy.ok{animation:none;color:var(--acc)}
.seat .set{font:.78em/1.5 var(--mono);color:var(--dim);margin:.35em 0 0}
.menu{position:absolute;left:50%;bottom:2.2em;transform:translateX(-50%);width:min(34em,94%);box-sizing:border-box;padding:1em 1.4em 1.1em;background:rgba(5,4,8,.94);border-top:1px solid color-mix(in srgb,var(--acc) 55%,transparent);border-bottom:1px solid color-mix(in srgb,var(--acc) 55%,transparent);z-index:4}
.menu h3{font:400 1.5em var(--display);letter-spacing:.14em;margin:0 0 .5em;color:var(--acc);text-align:center}
.menu p{display:flex;justify-content:space-between;gap:1em;margin:0;padding:.42em .7em;font:1.08em var(--body);color:var(--paper2)}
.menu p b{font:400 1em var(--display);letter-spacing:.06em;color:var(--paper);font-variant-numeric:tabular-nums}
.menu p.on{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--paper);box-shadow:inset 3px 0 0 var(--acc)}
.menu p.on b{color:var(--acc)}
.menu .hint{display:block;text-align:center;font:italic .85em var(--body);color:var(--dim);background:none;box-shadow:none;margin-top:.6em}
@keyframes breathe{50%{opacity:.35}}
#center{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;pointer-events:none}
#center h1{font:400 5em/1 var(--display);letter-spacing:.08em;margin:0;color:var(--paper);text-shadow:0 0 .35em rgba(143,230,255,.35),0 0 1em #000}
#center p{font:italic 1.25em/1.4 var(--body);margin:.35em auto 0;max-width:min(30em,90%);color:#cbbb94;text-shadow:0 0 .6em #000,0 0 1.2em #000}

/* in play */
.cap{position:absolute;left:50%;bottom:3.2%;transform:translateX(-50%);width:92%;text-align:center;font:italic 1.35em/1.35 var(--body);color:var(--paper);text-shadow:0 0 .4em #000,0 0 1em #000,0 0 1em #000;opacity:0;transition:opacity .4s;text-wrap:balance}
.cap.on{opacity:1}
.cap b{font-style:normal;font-family:var(--display);letter-spacing:.06em;color:var(--amber)}
.cap small{display:block;font:.68em/1.5 var(--display);letter-spacing:.14em;color:var(--paper2);margin-top:.3em}
.cap b.lt{color:var(--ecto);font-size:1.3em;letter-spacing:.3em}
.banner{position:absolute;left:0;right:0;bottom:30%;text-align:center;opacity:0;transition:opacity .6s;text-shadow:0 0 .5em #000,0 0 1.4em #000}
.banner.on{opacity:1}
.banner b{display:block;font:400 3em/1 var(--display);letter-spacing:.12em;color:var(--paper)}
.banner span{display:block;font:italic 1.2em/1.4 var(--body);color:var(--paper2);margin:.3em auto 0;max-width:36em;text-wrap:balance}
.note{position:absolute;left:50%;bottom:.8em;transform:translateX(-50%);width:94%;box-sizing:border-box;padding:.8em 1.2em;background:rgba(227,210,169,.94);color:var(--ink);font:.82em/1.35 var(--body);box-shadow:0 0 2em #000}
.note h4{font:400 1.2em var(--display);letter-spacing:.12em;margin:0 0 .4em}
.nsus{display:grid;grid-template-columns:repeat(5,1fr);gap:.8em}
.nsus div{min-width:0;border-top:1px solid rgba(13,11,18,.35);padding-top:.3em}
.nsus div.clr{opacity:.45;text-decoration:line-through}
.nsus b{display:block;font:400 1.05em var(--display);letter-spacing:.05em}
.nsus i{display:block;color:#4a3f2c;margin:.15em 0}
.nsus span{display:block}
.note p{margin:.6em 0 0}
.look,.endp{position:absolute;left:50%;bottom:2.5em;transform:translateX(-50%);width:min(44em,95%);box-sizing:border-box;text-align:center;padding:1.1em 1.4em 1.2em;background:rgba(5,4,8,.88);border-top:1px solid color-mix(in srgb,var(--acc) 50%,transparent);border-bottom:1px solid color-mix(in srgb,var(--acc) 50%,transparent)}
.look h3,.endp h3{font:400 1.9em/1.15 var(--display);letter-spacing:.08em;margin:.15em 0 .4em;color:var(--paper);text-wrap:balance}
.eyebrow{font:.78em var(--display);letter-spacing:.3em;color:var(--dim);margin:0}
.look dl{display:grid;grid-template-columns:auto 1fr;gap:.25em 1em;text-align:left;width:max-content;max-width:100%;margin:0 auto;font:1.15em/1.35 var(--body)}
.look dt{color:var(--dim);font-style:italic}
.look dd{margin:0;color:var(--ecto);font-family:var(--display);letter-spacing:.06em}
.hint{font:italic 1em/1.4 var(--body);color:var(--paper2);margin:.6em 0 0}
.ravens{font-size:2em;color:var(--amber);margin:0;letter-spacing:.2em}
.ravens span{color:rgba(227,210,169,.2)}
.truth{font:1.05em/1.45 var(--body);color:var(--paper2);margin:.4em auto 0;max-width:36em;text-wrap:balance}
.truth b{color:var(--paper);font-family:var(--display);letter-spacing:.05em;font-weight:400}

/* ---------------- phone ---------------- */
body.phone{background:var(--paper);color:var(--ink);font:17px/1.45 var(--body);-webkit-text-size-adjust:100%}
body.phone.gho{background:#06070d;color:#cfeaf2}
.ph{max-width:34rem;margin:0 auto;padding-block:1rem 3rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ph header{border-bottom:1px solid currentColor;padding-bottom:.7rem;margin-bottom:1rem}
.ph .eyebrow{font:.72rem var(--display);letter-spacing:.24em;color:inherit;opacity:.65}
.ph .clock{display:flex;align-items:center;gap:.7rem;margin:.35rem 0 .2rem}
.ph .clock b{font:400 1.7rem var(--display);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.ph .dawn{flex:1;height:4px;background:color-mix(in srgb,currentColor 18%,transparent);position:relative;min-width:0}
.ph .dawn i{position:absolute;inset:0 auto 0 0;background:var(--blood)}
.gho .ph .dawn i{background:var(--ecto)}
.ph .clock small{font:italic .8rem var(--body);opacity:.6}
.ph .stat{font:.7rem var(--mono);opacity:.6;margin:0}
.ph .stat.ok{opacity:.85}
.ph h2{font:400 1.05rem var(--display);letter-spacing:.16em;margin:1.4rem 0 .6rem}
.ph h2 small{font:italic .78rem var(--body);letter-spacing:0;opacity:.6;margin-left:.4rem}
.wait p{font:italic 1.1rem/1.5 var(--body);opacity:.75}
.cards{display:grid;gap:.7rem}
.card{display:flex;gap:.6rem;align-items:flex-start;padding:.6rem .7rem .7rem .2rem;border:1px solid rgba(13,11,18,.28);background:rgba(255,250,235,.35);cursor:pointer;-webkit-tap-highlight-color:transparent}
.card .pt-slot{flex:none;width:56px}
.card .pt{width:56px;height:86px;display:block}
.card .ct{min-width:0;flex:1}
.card h3{font:400 1.12rem var(--display);letter-spacing:.05em;margin:0}
.card h3 small{font:italic .82rem var(--body);letter-spacing:0;opacity:.6}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:0 .6rem;margin:.3rem 0 0;font-size:.95rem}
.card dt{opacity:.55;font-style:italic}
.card dd{margin:0}
.card blockquote{margin:.4rem 0 0;font-style:italic;font-size:.95rem;line-height:1.4}
.card .nq{margin:.3rem 0 0;font-style:italic;opacity:.55;font-size:.92rem}
.card .tg{margin:.35rem 0 0;font:.7rem var(--display);letter-spacing:.2em}
.card.tag-sus{border-color:var(--blood);box-shadow:inset 3px 0 0 var(--blood)} .card.tag-sus .tg{color:var(--blood)}
.card.tag-clr,.card.clr{opacity:.45}
.card.clr h3{text-decoration:line-through}
.ev p{margin:0 0 .6rem}
.ev b{display:block;font:400 .78rem var(--display);letter-spacing:.18em;opacity:.65}
.lts{font:400 1.9rem var(--display);letter-spacing:.35em;color:#2b6b80}
.res{padding:.8rem 1rem;border:1px solid currentColor;margin-bottom:.5rem}
.res h2{margin:0 0 .3rem}
.res p{margin:.2rem 0}
.rv{font-size:1.6rem;letter-spacing:.2em;color:var(--blood)} .rv span{opacity:.2}
.gho .rv{color:var(--ecto)}
.mem .v{font:400 1.25rem var(--display);letter-spacing:.06em;color:var(--ecto);margin:.1rem 0 0}
.mem .v.big{font-size:2.3rem;letter-spacing:.08em;text-shadow:0 0 .4em rgba(143,230,255,.5)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.2rem}
.stats span{display:block;font:.72rem var(--display);letter-spacing:.18em;opacity:.6}
.stats .bar{display:block;height:6px;background:rgba(143,230,255,.15);margin-top:.4rem;position:relative}
.stats .bar i{position:absolute;inset:0 auto 0 0;background:var(--ecto)}
.stats b{font:400 1.6rem var(--display)} .stats em{display:block;font:400 1.2rem var(--display);letter-spacing:.3em;color:var(--ecto);font-style:normal}
.log p{margin:0 0 .45rem;font-size:.95rem}
.log time{display:inline-block;min-width:5.2rem;font:.75rem var(--mono);opacity:.55;font-variant-numeric:tabular-nums}
.help p{font-size:.92rem;opacity:.75}
.ph button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.iv{border:1px solid var(--ink);background:rgba(255,250,235,.55);padding:.8rem .9rem 1rem;margin-bottom:.4rem;box-shadow:0 .2rem 0 rgba(13,11,18,.15)}
.ivh{display:flex;gap:.8rem;align-items:flex-end;border-bottom:1px solid rgba(13,11,18,.25);padding-bottom:.5rem}
.ivh h2{margin:0;font-size:1.45rem;letter-spacing:.06em}
.ivh .k,.mem .k{font:italic .85rem var(--body);opacity:.6;margin:0}
.lines{margin:.7rem 0 .4rem}
.lines .q{margin:.6rem 0 0;font:.78rem var(--display);letter-spacing:.12em;opacity:.65}
.lines .a{margin:.15rem 0 0;font-size:1.05rem;line-height:1.45}
.lines .a.falter{color:var(--blood)}
.tell{display:inline-block;margin-left:.5rem;padding:0 .4rem;font:.65rem var(--display);letter-spacing:.16em;color:var(--paper);background:var(--blood);vertical-align:.15em}
.tell.b{background:#4a3f2c}
.iv h3{font:400 .9rem var(--display);letter-spacing:.16em;margin:1rem 0 .4rem}
.iv h3 small{font:italic .78rem var(--body);letter-spacing:0;opacity:.6}
.asks{display:grid;gap:.45rem}
.asks button{display:flex;justify-content:space-between;align-items:baseline;gap:.8rem;text-align:left;padding:.65rem .75rem;border:1px solid var(--ink);background:var(--paper);font-size:1rem;line-height:1.3;cursor:pointer}
.asks button i{flex:none;font:.68rem var(--mono);opacity:.55;font-style:normal}
.asks button:active{background:#cdbb90}
.asks button:disabled{opacity:.35;cursor:default}
.asks button.wait{opacity:.6}
.asks.ev button{font-style:italic}
.row{display:flex;align-items:center;gap:.8rem;margin-top:.9rem;flex-wrap:wrap}
.row .nq{margin:0;font-size:.85rem}
.done{padding:.55rem 1.4rem;border:1px solid var(--ink);background:var(--ink);color:var(--paper)!important;font:1rem var(--display);letter-spacing:.14em;cursor:pointer}
.card.now{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.card dd.unk{opacity:.35}
.tg.tl{color:var(--blood)}
.evd em{font-style:italic;color:var(--blood)}
.sight{margin:0 0 .4rem}
.sight .map{display:block;width:min(100%,calc(74vh * 9 / 16));margin:0 auto;aspect-ratio:9/16;height:auto;border:1px solid rgba(143,230,255,.3);background:#070a12}
.legend{font:italic .95rem var(--body);color:var(--ecto);margin:.45rem 0 0;min-height:1.4em}
.mem{display:grid;grid-template-columns:1fr 1fr;gap:.2rem 1rem}
.mem>div:first-child{grid-column:1/-1}
.mem .v{margin:.1rem 0 .5rem}
/* accessibility: large, high-contrast phone text */
html:has(body.phone){font-size:20px}
body.phone{font-size:1.1rem;line-height:1.5}
body.phone,.ph{--minfs:.95rem}
.ph .eyebrow,.ph .stat,.ph .clock small,.ph h2 small,.card h3 small,.card dt,.ev b,.stats span,.log time,.ivh .k,.mem .k,.lines .q,.iv h3 small,.asks button i,.row .nq,.card .tg,.tell{font-size:.95rem!important;opacity:1!important;letter-spacing:.06em!important}
.card dl,.card blockquote,.card .nq,.log p,.help p,.lines .a,.legend,.wait p{font-size:1.1rem!important;opacity:1!important}
.card dt{opacity:.8!important}
.ph h2{font-size:1.2rem}
.iv h3{font-size:1.1rem}
.card h3{font-size:1.35rem}
.ph .clock b{font-size:2rem}
.asks button{font-size:1.15rem;min-height:3.4rem;padding:.8rem .9rem}
.asks button:disabled{opacity:.55}
.done{font-size:1.2rem;min-height:3rem}
.card .pt-slot{width:64px}.card .pt{width:64px;height:98px}
.mem .v{font-size:1.5rem}.mem .v.big{font-size:2.6rem}
.stats b{font-size:1.9rem}.stats em{font-size:1.5rem}
.lts{font-size:2.2rem}
body.buzz .ph header{animation:buzz .9s ease-out}
@keyframes buzz{0%{background:rgba(122,26,24,.35)}100%{background:transparent}}
.gho.buzz .ph header{animation-name:buzzg}
@keyframes buzzg{0%{background:rgba(143,230,255,.3)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.rdy{animation:none}body.buzz .ph header{animation:none}}
</style>
</head><body>

<div id="rot">
  <canvas id="c" width="720" height="1280"></canvas>
  <div class="layer" id="Lb"></div>
  <div class="layer" id="Lt"></div>
  <div id="center"><h1>Séance</h1><p>Lady Ashgrove lies dead on the drawing-room rug. Her ghost has until dawn to show the detective who did it, without saying a word.</p></div>
  <div id="perf"></div>
</div>

/* The case: exactly two suspects share the killer's scent, exactly two share the
   killer's mark, and only the killer has both. Alibis are a third, partial path. */
function genCase() {
  const ids = SUSPECTS.map(s => s.id);
  const killer = pick(ids);
  const others = shuffle(ids.filter(i => i !== killer));
  const sc = shuffle(SCENTS.slice()), mk = shuffle(MARKS.slice());
  const prof = {};
  prof[killer] = { scent: sc[0], mark: mk[0] };
  prof[others[0]] = { scent: sc[0], mark: mk[1] };
  prof[others[1]] = { scent: sc[1], mark: mk[0] };
  prof[others[2]] = { scent: sc[2], mark: mk[2] };
  prof[others[3]] = { scent: sc[3], mark: mk[3] };
  const inn = shuffle(others.slice()), pl = shuffle(PLACES.slice()), stmt = {};
  const nm = id => susById(id).name;
  stmt[inn[0]] = fill(pick(STMT_WITH), { place: pl[0], who: nm(inn[1]) });
  stmt[inn[1]] = fill(pick(STMT_WITH), { place: pl[0], who: nm(inn[0]) });
  stmt[inn[2]] = fill(pick(STMT_ALONE), { place: pl[1] });
  stmt[inn[3]] = fill(pick(STMT_ALONE), { place: pl[2] });
  const lieWith = Math.random() < .55 ? pick([inn[2], inn[3]]) : null;
  stmt[killer] = lieWith ? fill(pick(STMT_WITH), { place: pl[3], who: nm(lieWith) }) : fill(pick(STMT_ALONE), { place: pl[3] });
  for (const k in stmt) stmt[k] = cap1(stmt[k]);
  return { killer, prof, stmt, lieWith, weapon: pick(WEAPONS), spot: pick(HIDES).id, scent: sc[0], mark: mk[0] };
}

/* ---------------- phone link: PeerJS relay, or BroadcastChannel with &local ---------------- */
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
const newCode = () => Array.from({ length: 4 }, () => pick(CODE_CHARS)).join('');

function hostLink(code, h) {
  const api = { code, seen: {}, send() {}, linked: seat => performance.now() - (api.seen[seat] || -1e9) < 6500 };
  const got = (seat, m) => {
    if (!m || (seat !== 'det' && seat !== 'gho')) return;
    const fresh = !api.linked(seat);
    api.seen[seat] = performance.now();
    if (m.t === 'hello' || fresh) h.onHello(seat);
    if (m.t !== 'hello' && m.t !== 'ping' && h.onMsg) h.onMsg(seat, m);
  };
  if (LOCAL) {
    const bc = new BroadcastChannel('seance-' + code);
    bc.onmessage = e => { const m = e.data; if (m && m.to === 'cab') got(m.seat, m); };
    api.send = (seat, msg) => bc.postMessage(Object.assign({ to: seat }, msg));
    h.onStatus('local'); return api;
  }
  if (typeof Peer === 'undefined') { h.onStatus('off'); return api; }
  const conns = {}; let peer, tries = 0;
  function open() {
    try { peer = new Peer('seance-cab-' + api.code, { debug: 0 }); } catch (e) { h.onStatus('off'); return; }
    peer.on('open', () => { tries = 0; h.onStatus('ready'); });
    peer.on('connection', c => {
      c.on('data', m => {
        if (!m) return;
        const seat = m.seat || c._seat;
        if (m.t === 'hello') { const old = conns[seat]; if (old && old !== c) { try { old.close(); } catch (e) {} } conns[seat] = c; c._seat = seat; }
        got(seat, m);
      });
      c.on('close', () => { if (c._seat && conns[c._seat] === c) delete conns[c._seat]; });
      c.on('error', () => {});
    });
    peer.on('disconnected', () => { h.onStatus('reconnecting'); setTimeout(() => { try { if (!peer.destroyed) peer.reconnect(); } catch (e) {} }, 1500); });
    peer.on('error', e => {
      if (e.type === 'unavailable-id') {
        tries++; try { peer.destroy(); } catch (_) {}
        if (tries > 2) { api.code = newCode(); h.onCode(api.code); }
        h.onStatus('waiting'); setTimeout(open, 2500);
      } else if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(e.type)) h.onStatus('offline');
    });
  }
  open();
  api.send = (seat, msg) => { const c = conns[seat]; if (c && c.open) { try { c.send(msg); } catch (e) {} } };
  return api;
}

function clientLink(code, seat, h) {
  const api = { send() {} };
  if (LOCAL) {
    const bc = new BroadcastChannel('seance-' + code);
    bc.onmessage = e => { const m = e.data; if (m && m.to === seat) { h.onStatus('linked'); h.onMsg(m); } };
    api.send = m => bc.postMessage(Object.assign({ to: 'cab', seat }, m));
    api.send({ t: 'hello' }); setInterval(() => api.send({ t: 'ping' }), 2000);
    h.onStatus('connecting'); return api;
  }
  if (typeof Peer === 'undefined') { h.onStatus('error'); return api; }
  let peer, conn, alive = 0, pending = false;
  function connect() {
    if (!peer || peer.destroyed || peer.disconnected || pending || (conn && conn.open)) return;
    pending = true; h.onStatus('connecting');
    conn = peer.connect('seance-cab-' + code, { reliable: true });
    conn.on('open', () => { pending = false; conn.send({ t: 'hello', seat }); h.onStatus('linked'); });
    conn.on('data', m => { alive = Date.now(); h.onMsg(m); });
    conn.on('close', () => { pending = false; h.onStatus('lost'); });
    conn.on('error', () => { pending = false; });
    setTimeout(() => { pending = false; }, 6000);
  }
  peer = new Peer({ debug: 0 });
  peer.on('open', connect);
  peer.on('error', e => { pending = false; h.onStatus(e.type === 'peer-unavailable' ? 'nocab' : 'error'); });
  peer.on('disconnected', () => setTimeout(() => { try { if (!peer.destroyed) peer.reconnect(); } catch (e) {} }, 1500));
  setInterval(() => {
    if (conn && conn.open) { conn.send({ t: 'ping', seat }); if (Date.now() - alive > 9000) h.onStatus('quiet'); }
    else connect();
  }, 2000);
  api.send = m => { if (conn && conn.open) conn.send(Object.assign({ seat }, m)); };
  return api;
}

/* ---------------- ink helpers ---------------- */
function mkHatch(g, sp, dirs, lw, a) {
  const s = sp * 4, c = document.createElement('canvas'); c.width = c.height = s;
  const x = c.getContext('2d'); x.strokeStyle = `rgba(13,11,18,${a})`; x.lineWidth = lw; x.beginPath();
  for (const d of dirs) for (let k = -s; k <= 2 * s; k += sp) {
    if (d === '/') { x.moveTo(k, s); x.lineTo(k + s, 0); }
    else if (d === '\\') { x.moveTo(k, 0); x.lineTo(k + s, s); }
    else if (d === '|' && k >= 0 && k < s) { x.moveTo(k + .5, 0); x.lineTo(k + .5, s); }
    else if (d === '-' && k >= 0 && k < s) { x.moveTo(0, k + .5); x.lineTo(s, k + .5); }
  }
  x.stroke(); return g.createPattern(c, 'repeat');
}
function mkPats(g) {
  return {
    h1: mkHatch(g, 6, ['/'], .9, .42), h2: mkHatch(g, 4, ['/'], .9, .6),
    x1: mkHatch(g, 5, ['/', '\\'], .9, .5), x2: mkHatch(g, 3, ['/', '\\'], 1, .78),
    v: mkHatch(g, 5, ['|'], .8, .35), hz: mkHatch(g, 3, ['-'], .8, .5)
  };
}
function wpath(g, pts, closed, amp = .9) {
  g.beginPath(); const n = pts.length;
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const a = pts[i], b = pts[(i + 1) % n], d = Math.hypot(b[0] - a[0], b[1] - a[1]), st = Math.max(1, Math.floor(d / 14));
    for (let k = 0; k <= st; k++) {
      if (i > 0 && k === 0) continue;
      const t = k / st, x = a[0] + (b[0] - a[0]) * t + (R() - .5) * amp * 2, y = a[1] + (b[1] - a[1]) * t + (R() - .5) * amp * 2;
      (i === 0 && k === 0) ? g.moveTo(x, y) : g.lineTo(x, y);
    }
  }
  if (closed) g.closePath();
}
const rectPts = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
function fillPat(g, p, a = 1) { g.save(); g.globalAlpha = a; g.fillStyle = p; g.fill(); g.restore(); }
function inkRect(g, x, y, w, h, fillC, lw = 1.5, pat, pa = 1) {
  wpath(g, rectPts(x, y, w, h), true);
  if (fillC) { g.fillStyle = fillC; g.fill(); }
  if (pat) fillPat(g, pat, pa);

}
function frame(t) {

  const ms = performance.now() - t0;

  netT += raw; if (netT > .4) { netT = 0; pushState(false); watchLinks(); if (state === 'title') refreshSeats(); }
  posT += raw; if (posT > .16) { posT = 0; pushPos(); }
  perfT += raw;
  if (perfT > .25) {
    perfT = 0;
    perfEl.textContent = hudOn ? `${fpsE.toFixed(0)} fps · ${msE.toFixed(1)} ms · ${cv.width}×${cv.height} · ${qLvl}${qMode === 'auto' ? ' (auto)' : ''}\nroom ${link.code} · det ${link.linked('det') ? 'linked' : '—'} · ghost ${link.linked('gho') ? 'linked' : '—'} · ${swapped ? 'swapped' : '1P detective'}\n1 quality · 2 flip ends · 3 swap · H hide` : '';
  }

}
buildLayers(); fit(); setupBuffers(); resetRoom(); refreshSeats(); requestAnimationFrame(frame);

}

        <div class="asks">

  /* ---------- ghost: memories and ghost sight ---------- */

  const disp = {};

      if (tw) {
        const gr = g.createRadialGradient(d.x, d.y - 30, 0, d.x, d.y - 30, 80); gr.addColorStop(0, 'rgba(120,225,255,.55)'); gr.addColorStop(1, 'rgba(120,225,255,0)');
        g.fillStyle = gr; g.fillRect(d.x - 90, d.y - 120, 180, 180);
        g.strokeStyle = 'rgba(150,235,255,.5)'; g.lineWidth = 3;
        for (let i = 0; i < 3; i++) { const a = T * 1.5 + i * 2.1; g.beginPath(); g.moveTo(d.x + Math.cos(a) * 20, d.y - 70); g.quadraticCurveTo(d.x + Math.cos(a + 1) * 34, d.y - 100, d.x + Math.cos(a + 2) * 16, d.y - 126); g.stroke(); }
      }
      if (carry) { g.strokeStyle = 'rgba(255,120,110,.9)'; g.lineWidth = 5; ell(g, d.x, d.y - 30, 52 + Math.sin(T * 8) * 6, 52 + Math.sin(T * 8) * 6); g.stroke(); }

      ell(g, d.x, d.y - 62, 11, 12); g.fill();
      g.beginPath(); g.moveTo(d.x - 9, d.y - 50); g.lineTo(d.x + 9, d.y - 50); g.lineTo(d.x + 17, d.y); g.lineTo(d.x - 17, d.y); g.closePath(); g.fill();

    g.fillStyle = 'rgba(160,235,255,.85)'; g.fillText('you', gd.x, gd.y + 14);
    const lt = st.mem.found ? 'The weapon is found. Help him choose between the glowing two.' : pos.carrier ? `${susById(pos.carrier).name} is carrying the weapon.` : `Glowing: they smell of ${st.mem.scent}.`;
    if (legend.textContent !== lt) legend.textContent = lt;
  }

  function render() {

    const en = bodyEl.querySelector('.en'); if (en && st.energy != null) en.style.width = `${st.energy}%`;
  }
  function loop(t) { T = t / 1000; drawMap(); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);

  const net = clientLink(code, seat, {
    onMsg(m) {
      if (!m) return;
      if (m.t === 'pos') { pos = m; return; }
      if (m.t !== 'st') return;
      const first = !st; st = m;
      if (m.buzz !== lastBuzz) {
        if (lastBuzz >= 0 && navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate([90, 50, 90]);
        if (lastBuzz >= 0) { document.body.classList.remove('buzz'); void document.body.offsetWidth; document.body.classList.add('buzz'); }

  });

}
