<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#03070b">
<title>TERMINAL ARC</title>
<style>
:root{--ink:#03070b;--pan:rgba(4,12,18,.93);--ln:#164654;--cy:#63f0ff;--cy2:#1b9cab;--rd:#ff3d2e;--am:#ffb020;--gn:#69ffb0;--tx:#d3f1f5;--dim:#7ba3ab;
--f:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;color:var(--tx);font-family:var(--f);-webkit-user-select:none;user-select:none;touch-action:none}
canvas#g{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0,rgba(0,0,0,.16) 1px,transparent 1px,transparent 3px);opacity:.55;mix-blend-mode:multiply}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}
#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#hud button,#hud input,#hud .list,#hud .chips{pointer-events:auto}
.hide{display:none!important}
#top{display:flex;gap:8px;padding:10px 10px 0}
.box{border:1px solid var(--ln);background:var(--pan);padding:5px 9px 4px;min-width:0}
.box small{display:block;font-size:11px;letter-spacing:.12em;color:var(--dim)}
.box b{display:block;font-size:19px;font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bDef{flex:0.7}#bNat{flex:1.3}#bYou{flex:0.95}
#bDef b{color:var(--am)}#bYou b{color:var(--cy)}
.ic{width:48px;flex:none;border:1px solid var(--ln);background:var(--pan);color:var(--cy);font:700 20px var(--f)}
#ebar{padding:0 10px 8px}
#toll{padding:6px 12px 0;font:700 15px var(--f);letter-spacing:.08em;color:#ff6a58;text-shadow:0 0 10px rgba(255,61,46,.45);font-variant-numeric:tabular-nums}
#toll.zero{color:var(--dim);text-shadow:none}
#een{border:1px solid var(--ln);background:var(--pan);height:42px;position:relative;overflow:hidden}
#foebar{position:absolute;left:0;top:0;bottom:0;width:50%;background:linear-gradient(90deg,rgba(255,61,46,.22),rgba(255,61,46,.52))}
#eent{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font:700 14px var(--f);letter-spacing:.06em}
#feed{padding:8px 14px 0;font-size:14px;line-height:1.35;min-height:60px}
#feed div{opacity:0;animation:fi .25s forwards;text-shadow:0 0 6px #000}
#feed .warn{color:var(--am)}#feed .bad{color:var(--rd)}#feed .good{color:var(--gn)}#feed .n{color:var(--tx)}
@keyframes fi{to{opacity:1}}
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:26px;font-weight:800;letter-spacing:.06em;pointer-events:none;opacity:0;text-shadow:0 0 18px currentColor;padding:0 16px}
#banner.on{animation:bn 2.4s ease-out forwards}
@keyframes bn{0%{opacity:0;transform:scale(1.12)}8%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0}}
#dock{margin-top:auto;display:flex;flex-direction:column}
#threats{display:flex;gap:8px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none;touch-action:pan-x}
#threats::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rd);background:rgba(60,8,4,.88);color:#ffd2cc;padding:8px 12px;font:600 14px var(--f);min-height:44px}
.chip b{color:#fff;font-size:17px;margin-right:6px}.chip.sel{background:rgba(120,16,8,.95);box-shadow:0 0 12px rgba(255,60,40,.6)}
#sheet{background:var(--pan);border-top:1px solid var(--cy2);padding:12px 14px calc(14px + env(safe-area-inset-bottom));pointer-events:auto;max-height:52vh;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.ttl{font-size:19px;font-weight:800;color:#fff;flex:1;min-width:0}
.sub{font-size:14px;color:var(--dim);line-height:1.4}
.hint{font-size:15px;line-height:1.45;color:var(--tx)}
.btn{min-height:50px;border:1px solid var(--cy2);background:rgba(27,156,171,.16);color:var(--cy);font:700 16px var(--f);letter-spacing:.04em;padding:0 14px;position:relative;overflow:hidden}
.btn:disabled{opacity:.35}
.btn.go{border-color:var(--cy);background:rgba(99,240,255,.22);color:#fff}
.btn.red{border-color:var(--rd);background:rgba(255,61,46,.18);color:#ffdcd7}
.btn.sq{width:50px;padding:0;flex:none}
.btn .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,61,46,.55)}
.btn span{position:relative}
.btn.on{background:rgba(255,176,32,.25);border-color:var(--am);color:#ffe2a8}
.btns{display:flex;gap:10px}.btns .btn{flex:1}
.x{border:1px solid var(--ln);background:none;color:var(--dim);width:44px;height:44px;font:700 18px var(--f)}
.step{display:flex;align-items:center;gap:8px;font-size:16px}
.step b{min-width:100px;text-align:center;font-size:17px;color:#fff}
input.q{width:100%;height:46px;background:#06131b;border:1px solid var(--ln);color:var(--tx);font:16px var(--f);padding:0 12px;outline:none}
.list{overflow-y:auto;touch-action:pan-y;flex:1;min-height:120px;border:1px solid var(--ln);background:#050e14;-webkit-overflow-scrolling:touch}
.li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;min-height:46px;border-bottom:1px solid #0b2029;font-size:16px}
.li small{color:var(--dim);font-size:13px;white-space:nowrap}
.li.on{background:rgba(99,240,255,.16);color:#fff}.li.on.e{background:rgba(255,61,46,.2)}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{border:1px solid var(--rd);color:#ffd2cc;padding:4px 8px;font-size:14px}
#title,#end{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 22px calc(34px + env(safe-area-inset-bottom));text-align:center;gap:14px;background:linear-gradient(transparent 20%,rgba(3,7,11,.86) 62%)}
#end{background:linear-gradient(rgba(3,7,11,.1) 0%,rgba(3,7,11,.3) 28%,rgba(3,7,11,.9) 60%)}
#title h1,#end h1{margin:0;font-size:40px;letter-spacing:.14em;font-weight:800;color:#fff;text-shadow:0 0 24px rgba(99,240,255,.55)}
#title p,#end p{margin:0;font-size:16px;line-height:1.5;color:var(--tx);max-width:420px}
#title .btn,#end .btn{width:100%;max-width:360px;min-height:58px;font-size:18px}
#amode{min-height:44px!important;font-size:14px!important;letter-spacing:.08em}
#amodeh{font-size:12px;color:var(--dim);letter-spacing:.06em;min-height:14px}
#end .res{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:400px}
#end .res div{border:1px solid var(--ln);background:var(--pan);padding:10px}
#epi{display:flex;flex-direction:column;gap:8px;width:100%;max-width:420px;text-align:left}
#epi div{opacity:0;animation:fi 1.4s forwards;font-size:14px;line-height:1.45;color:var(--tx)}
#epi b{display:block;font-size:12px;letter-spacing:.14em;color:#ff8a6a;margin-bottom:1px}
#end .res small{display:block;font-size:12px;letter-spacing:.1em;color:var(--dim)}#end .res b{font-size:22px}
</style></head><body>

const WORLD=RAW.map((r,i)=>{
  const rings=r.r.map(flat=>{
    const ll=[];let x=0,y=0;
    for(let k=0;k<flat.length;k+=2){x+=flat[k];y+=flat[k+1];ll.push([x/100,y/100]);}
    let mnx=999,mny=999,mxx=-999,mxy=-999;
    for(const p of ll){if(p[0]<mnx)mnx=p[0];if(p[0]>mxx)mxx=p[0];if(p[1]<mny)mny=p[1];if(p[1]>mxy)mxy=p[1];}
    const out=[];let pv=null;
    for(const p of ll){
      const v=ll2v(p[1],p[0]);
      if(pv){const om=ang(pv,v);if(om>0.045){const k=Math.ceil(om/0.045),so=Math.sin(om);for(let j=1;j<k;j++){const s=slerp(pv,v,om,so,j/k);out.push(s[0],s[1],s[2]);}}}
      out.push(v[0],v[1],v[2]);pv=v;
    }
    return{ll,vec:new Float32Array(out),n:out.length/3,bb:[mnx,mny,mxx,mxy]};
  });
  const cv=ll2v(r.c[0],r.c[1]);let cap=0.02;
  for(const g of rings){for(let k=0;k<g.n;k+=3){const a=Math.acos(clamp(cv[0]*g.vec[k*3]+cv[1]*g.vec[k*3+1]+cv[2]*g.vec[k*3+2],-1,1));if(a>cap)cap=a;}}
  return{i,name:r.n,pop:r.p,cont:r.ct,play:!!r.pl,rings,cv,clat:r.c[0],clon:r.c[1],cap,ci:r.ci||[],si:r.si||[],su:r.su||[],a:r.a||0,role:0};
});

function pip(lon,lat,ll){let ins=false;for(let i=0,j=ll.length-1;i<ll.length;j=i++){const a=ll[i],b=ll[j];if((a[1]>lat)!==(b[1]>lat)&&lon<(b[0]-a[0])*(lat-a[1])/(b[1]-a[1])+a[0])ins=!ins;}return ins;}
function countryAt(lat,lon){
  for(const c of WORLD){for(const r of c.rings){const b=r.bb;if(lon<b[0]||lon>b[2]||lat<b[1]||lat>b[3])continue;if(pip(lon,lat,r.ll))return c;}}
  return null;
}

  const subN=c.su.length?Math.round(c.a*0.25):0;
  const siloN=c.a-subN;
  c.si.forEach((s,i)=>{const share=Math.floor(siloN/c.si.length)+(i<siloN%c.si.length?1:0);n.silos.push({kind:'silo',name:c.name+' silo '+(i+1),lat:s[0],lon:s[1],v:ll2v(s[0],s[1]),n:share,alive:true,nat:n});});
  c.su.forEach((s,i)=>{const share=Math.floor(subN/c.su.length)+(i<subN%c.su.length?1:0);n.subs.push({kind:'sub',name:c.name+' submarine',lat:s[0],lon:s[1],v:ll2v(s[0],s[1]),n:share,alive:true,nat:n,reveal:-99});});

/* ---------- missiles ---------- */
const ease=u=>u*u*(3-2*u)*0.25+u*0.75;
function mPos(m,u){
  const f=m.lin?u:ease(u);
  const g=slerp(m.a,m.b,m.om,m.so,f);
  const h=m.h0*Math.pow(1-u,1.4)+m.Hb*4*u*(1-u);
  return[g,h];
}
function fire(owner,site,target,delay){
  if(!site||site.n<=0||!site.alive)return null;
  site.n--;owner.launched++;
  const a=site.v,b=target.v,om=Math.max(0.02,ang(a,b));
  const k=om/PI,dur=clamp(26+64*Math.pow(k,0.85),26,92);
  const m={id:++G.mid,owner,site,target,a,b,om,so:Math.sin(om),t0:G.T+delay,dur,h0:0,Hb:0.05+0.32*Math.pow(k,0.7),lin:false,state:'queued',detected:owner.role==='player',dAt:0,trail:[],nt:0,dead:false,y:0.75+rnd()*0.5,mirv:owner.c.a>=16&&site.kind!=='sub'&&rnd()<0.25,split:false,child:false,sel:false};
  m.dAt=m.t0+(site.kind==='sub'?0.45*dur:0.07*dur+0.5);

}
function spawnFalseAlarm(){
  G.fa.done=true;G.faActive=true;
  const P=G.player,en=G.enemies[Math.floor(rnd()*G.enemies.length)];
  const sites=[...en.silos.filter(s=>s.alive),...en.subs];const cs=P.cities.filter(c=>c.alive>0.1);
  if(!sites.length||!cs.length){G.faActive=false;return;}
  const k=1+Math.floor(rnd()*3),end=G.T+7+rnd()*2.5;
  for(let i=0;i<k;i++){
    const site=sites[Math.floor(rnd()*sites.length)],t=cs[Math.floor(rnd()*cs.length)];
    const a=site.v,b=t.v,om=Math.max(0.02,ang(a,b)),kk=om/PI,dur=clamp(26+64*Math.pow(kk,0.85),26,92);
    const m={id:++G.mid,owner:en,site,target:t,a,b,om,so:Math.sin(om),t0:G.T,dur,h0:0,Hb:0.05+0.32*Math.pow(kk,0.7),lin:false,state:'fly',detected:true,dAt:0,trail:[],nt:0,dead:false,y:1,mirv:false,split:false,child:false,sel:false,fake:true,fakeEnd:end};
    G.missiles.push(m);G.ev.push({k:'detect',m});
  }

}
function resolveFalseAlarm(wasted){
  if(!G.faActive)return;G.faActive=false;
  for(const m of G.missiles)if(m.fake&&!m.dead){m.dead=true;m.state='done';G.ghosts.push({trail:m.trail,t:G.T,owner:m.owner});}
  banner('FALSE ALARM','#69ffb0');
  msg(wasted?'Your interceptor found nothing. Radar error — sunlight off high cloud. No launch.':'Radar error — sunlight off high cloud. There was no launch.','good');
  if(G.anyLaunch&&G.firedOnFalse)msg('You fired first. They are answering now.','bad');
  G.ev.push({k:'falseclear'});
}
function onLaunch(m){
  const o=m.owner;
  if(o.role==='player'&&G.faActive&&!G.anyLaunch)G.firedOnFalse=true;
  G.ev.push({k:'launch',m});
  if(o.role==='player'){G.stat.launchedP++;if(!G.anyLaunch){G.anyLaunch=true;G.provoked=true;setDefcon(1);msg('You have launched. Every adversary is now armed.','bad');}}
  else{G.stat.launchedE++;if(!G.anyLaunch){G.anyLaunch=true;setDefcon(1);}}
  if(m.site.kind==='sub')m.site.reveal=G.T+14;

    const tn=m.target.nat;
    if(tn.ai&&tn.intc>0&&rnd()<0.72){G.sched.push({t:G.T+1.2+rnd()*2.4,fn:()=>{if(!m.dead&&m.state==='fly')doIntercept(m,tn,true);}});}

function pickSiteAI(n,t,useSub){

  if(!best)for(const s of n.subs){if(s.n<=0)continue;const d=ang(s.v,t.v);if(d<bd){bd=d;best=s;}}
  if(!best&&useSub)for(const s of n.silos){if(!s.alive||s.n<=0)continue;const d=ang(s.v,t.v);if(d<bd){bd=d;best=s;}}
  return best;
}
function aiTarget(n){
  const P=G.player;

  if(silos.length&&rnd()<0.42)return silos[Math.floor(rnd()*silos.length)];
  const cs=P.cities.filter(c=>c.alive>0.08);
  if(!cs.length)return silos.length?silos[0]:null;
  let tot=0;const w=cs.map(c=>{const x=c.pop*c.alive+0.05;tot+=x;return x;});

}
function standDown(){

function playerFire(targets,per){

/* ---------- step ---------- */
function stepGame(dt){
  if(!G)return;
  G.T+=dt;
  G.flash=Math.max(0,G.flash-dt*1.6);G.shake=Math.max(0,G.shake-dt*10);
  for(let i=G.sched.length-1;i>=0;i--){if(G.T>=G.sched[i].t){const s=G.sched.splice(i,1)[0];s.fn();}}
  if(!G.over)for(const n of G.enemies){if(popAlive(n)<=n.popTotal*0.01&&n.ai.state!=='spent'){n.ai.state='spent';msg(up(n.name)+' has ceased to exist','good');}aiUpdate(n);}
  if(G.fa&&!G.fa.done&&!G.anyLaunch&&G.T>=G.fa.t)spawnFalseAlarm();
  else if(G.fa&&!G.fa.done&&G.anyLaunch)G.fa.done=true;
  for(const m of G.missiles){
    if(m.dead)continue;
    if(m.fake){if(G.T>=m.fakeEnd){resolveFalseAlarm(false);continue;}const u=(G.T-m.t0)/m.dur;if(G.T>=m.nt){const[g,h]=mPos(m,clamp(u,0,1));m.trail.push([g[0],g[1],g[2],h]);m.nt=G.T+0.3;}continue;}
    if(m.state==='queued'){if(G.T>=m.t0){m.state='fly';onLaunch(m);}else continue;}
    const u=(G.T-m.t0)/m.dur;
    if(!m.detected&&G.T>=m.dAt){m.detected=true;G.ev.push({k:'detect',m});}
    if(u>=1){m.state='done';m.dead=true;G.ghosts.push({trail:m.trail,t:G.T,owner:m.owner});detonate(m);continue;}
    if(G.T>=m.nt){const[g,h]=mPos(m,clamp(u,0,1));m.trail.push([g[0],g[1],g[2],h,G.T]);m.nt=G.T+0.3;if(m.trail.length>340)m.trail.shift();}
    if(m.mirv&&!m.split&&u>=0.52)split(m,u);
  }

  for(const I of G.intc){
    if(I.done)continue;
    if(G.T>=I.nt){const f=clamp((G.T-I.t0)/I.dur,0,1);const g=slerp(I.a,I.b,I.om,I.so,f);I.trail.push([g[0],g[1],g[2],0.04*4*f*(1-f)+I.hm*f*f]);I.nt=G.T+0.08;}

  G.fx=G.fx.filter(f=>G.T-f.t<(f.k==='nuke'?11:f.k==='airburst'?2.6:1.6));

}
const WIND=0.22; // degrees of longitude per second, west to east

function stepAftermath(dt){

    if(L.left<=0)continue;const d=Math.min(L.left,L.rate*dt);L.left-=d;
    const cs=L.nat.cities.filter(c=>c.alive>0.02);let tot=0;for(const c of cs)tot+=c.pop*c.alive;

function updateToll(dt){

function updateHud(){

  }
  if(!sel){const sd=$('sd');if(sd)sd.disabled=G.standUsed||G.anyLaunch;}
}
function epilogue(r,cas){
  const hits=G.scars.length,borders=Object.keys(G.bystanderSeen).length,later=G.bystander;
  if(r==='peace'||hits===0)return[['1 HOUR LATER','The radar screens go quiet. Crews stand down.'],['1 WEEK LATER','The news moves on. Few people learn how close it was.'],['1 YEAR LATER','The missiles are still in their silos. Still pointed.']];
  const fam=Math.min(5000,Math.max(cas*3,hits*55));
  return[
    ['1 HOUR LATER',`Firestorms burn where ${hits} warhead${hits>1?'s':''} landed. ${fmtM(cas)} dead.`],
    ['1 WEEK LATER',borders?`Fallout has crossed into ${borders} countr${borders>1?'ies':'y'} that never fought. ${fmtM(cas*0.25+later)} more have died.`:`Radiation sickness spreads through the survivors. ${fmtM(cas*0.25)} more have died.`],
    ['1 YEAR LATER',`Smoke has dimmed the sun. Harvests fail far beyond the war zone. Up to ${fmtM(fam)} face famine.`]
  ];
}
function showEnd(){
  const P=G.player;const pa=popAlive(P),pt=P.popTotal;let ea=0,et=0;G.enemies.forEach(n=>{ea+=popAlive(n);et+=n.popTotal;});

  else if(pa/pt>ea/et+0.05&&pa>pt*0.4){title='SURVIVED';line='You came through with more than they did. It does not feel like winning.';good=true;}
  else if(pa/pt>ea/et){title='BARELY STANDING';line='You outlasted them by a little. The world will not recover soon.';}
  else{title='DEVASTATED';line='They kept more than you did.';}

/* --- input --- */
const ptrs=new Map();let pinch0=0,zoom0=1,tapInfo=null,lastMove=0;
cv.addEventListener('pointerdown',e=>{
  view.lastInput=view.t;unlockAudio();try{cv.setPointerCapture(e.pointerId);}catch(x){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});cam.goal=null;cam.vx=cam.vy=0;UI.idle=0;
  if(ptrs.size===1)tapInfo={x:e.clientX,y:e.clientY,t:performance.now(),moved:0};
  else{tapInfo=null;const a=[...ptrs.values()];pinch0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);zoom0=cam.zoom;}
});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;view.lastInput=view.t;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;UI.idle=0;
  if(ptrs.size===1){
    if(tapInfo)tapInfo.moved+=Math.abs(dx)+Math.abs(dy);
    const k=1/cam.R/D2R;const now=performance.now();const dtm=Math.max(8,now-lastMove)/1000;lastMove=now;
    cam.lon-=dx*k;cam.lat+=dy*k;cam.vx=clamp(-dx*k/dtm,-160,160);cam.vy=clamp(dy*k/dtm,-120,120);
  }else if(ptrs.size===2){const a=[...ptrs.values()];const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch0>0)cam.zoom=clamp(zoom0*d/pinch0,0.7,80);}
});
const endP=e=>{
  const had=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);
  if(had&&tapInfo&&e.type==='pointerup'&&tapInfo.moved<10&&performance.now()-tapInfo.t<400){handleTap(e.clientX,e.clientY);}

cv.addEventListener('pointerup',endP);cv.addEventListener('pointercancel',endP);
cv.addEventListener('wheel',e=>{e.preventDefault();view.lastInput=view.t;cam.zoom=clamp(cam.zoom*(e.deltaY<0?1.1:0.9),0.7,80);},{passive:false});
$('start').addEventListener('click',()=>{unlockAudio();sndUI(600);setMode('pickP');});
function paintAudioMode(){
  const b=$('amode'),h=$('amodeh');if(!b)return;
  b.textContent='AUDIO: '+(AUDIO_MODE==='tight'?'TIGHT':'SMOOTH');
  let t=AUDIO_MODE==='tight'?'Smallest buffer. Can crackle.':'Bigger buffer, fewer dropouts.';

$('snd').addEventListener('click',()=>{unlockAudio();setSound(!cfg.sound);$('snd').style.opacity=cfg.sound?1:0.4;sndUI(700);});

/* --- loop --- */
let last=0;
function cineTick(dt){
  view.slowT=1;
  if(view.mode!=='play'||!G||G.over){view.cine=null;view.lc=null;}
  else{
    const idle=view.t-view.lastInput>2.5;
    if(view.lc){
      if(view.lc.input!==view.lastInput){view.lc=null;}
      else if(view.t<view.lc.until){cam.goal={lat:view.lc.site.lat,lon:view.lc.site.lon};}
      else{cam.zoom=view.lc.zoom0;view.lc=null;}
    }else if(view.cine){
      const c=view.cine;
      if(!idle){view.cine=null;}
      else if(!c.m.dead&&c.m.state==='fly'){if(c.m.t0+c.m.dur-G.T<1.3)view.slowT=0.45;}
      else{if(!c.end)c.end=view.t;if(view.t-c.end>2.4)view.cine=null;}
    }else if(idle){
      let pick=null,pr=9;
      for(const m of G.missiles){if(m.fake||m.owner.role==='player'||!m.detected||m.dead||m.state!=='fly'||m.target.nat!==G.player||m.target.kind!=='city'||m.target.alive<0.06)continue;const r=m.t0+m.dur-G.T;if(r<3.4&&r>1.4&&r<pr){pr=r;pick=m;}}
      if(pick){view.cine={m:pick,zoom0:cam.zoom,end:0};}
    }
  }

function frame(t){
  const dt=Math.min(0.05,Math.max(0,(t-last)/1000));last=t;
  cineTick(dt);
  if(view.mode==='play'&&G)stepGame(dt*view.slow);
  if(view.mode!=='play'){UI.idle+=dt;if(!ptrs.size&&!cam.goal&&UI.idle>1.5)cam.lon+=4*dt;}
  updateCam(dt);drawFrame(dt);updateToll(dt);
  if(G){pump();UI.lastHud-=dt;if(UI.lastHud<=0&&view.mode==='play'){UI.lastHud=0.12;updateHud();flushFeed();}}

  audioTick();
  requestAnimationFrame(frame);
}
resize();cam.cy=CH/2;
window.__TA={totalDead,updateToll,epilogue,cineTick,sunVec,WORLD,newGame,stepGame,setMode,frame,cam,view,UI,get G(){return G;},startWar,handleTap,pickAt,choosePlayer,playerFire,doIntercept,standDown,drawFrame,updateCam,resize,fmtM,popAlive,pump,updateHud,showEnd,setSel,renderSheet,audioTick,unlockAudio};
if(!window.__TA_TEST)requestAnimationFrame(frame);

})();
